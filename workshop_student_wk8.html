      hint: 'Consider whether your Task 8 and Task 9 conclusions point in the same direction or pull against each other.',
      inputs: [
        { id: 'final_position', kind: 'choice', label: 'The EU\'s current integration model is:', options: ['Sustainable: the Economic Union model is resilient enough to manage future crises', 'Unsustainable: deeper Political Union is structurally necessary for long-term survival', 'Conditionally sustainable: the model can persist if Germany accepts greater fiscal burden-sharing'] },
        { id: 'decisive_evidence', kind: 'textarea', label: 'What is the single most decisive piece of evidence for your position?', placeholder: 'Name the evidence and explain its weight...' },
        { id: 'opposing_strength', kind: 'textarea', label: 'What is the strongest remaining objection to your position?', placeholder: 'Acknowledge what the other side gets right...' }
      ]
    }
  ]
 
}; // end WEEK_CONFIG
// ════════════════════════════════════════════════════════════════════════════
//  END OF CONFIG — do not edit below this line
// ════════════════════════════════════════════════════════════════════════════

// ── Derived constants ──────────────────────────────────────────────────────
const TASKS = WEEK_CONFIG.tasks;
const TASK_COUNT = TASKS.length;

// Unique section labels in insertion order
const SECTIONS = [...new Set(TASKS.map(t => t.section))];

// ── Populate static DOM from config ───────────────────────────────────────
document.title = `INTBUS 201 — Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-week-label').textContent  = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-title').textContent        = WEEK_CONFIG.title;
document.getElementById('wc-case-ref').textContent     = WEEK_CONFIG.caseRef;
document.getElementById('header-title').textContent    = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('header-sub').textContent      = WEEK_CONFIG.title;
document.getElementById('complete-msg').textContent    =
  `Your group has completed all ${TASK_COUNT} tasks. The facilitator will select responses for full-class discussion shortly.`;

// Completion summary grid: count each type
const typeCounts = {};
TASKS.forEach(t => typeCounts[t.type] = (typeCounts[t.type] || 0) + 1);
document.getElementById('summary-grid').innerHTML = Object.entries(typeCounts)
  .map(([type, n]) => `<div class="summary-stat"><div class="stat-num">${n}</div><div class="stat-label">${type}</div></div>`)
  .join('');

// Debrief hint: mention the last section's highest-id tasks
const lastSection = SECTIONS[SECTIONS.length - 1];
const lastTasks = TASKS.filter(t => t.section === lastSection);
const hintIds = lastTasks.slice(-3).map(t => `Task ${t.id}`).join(', ');
document.getElementById('debrief-hint').textContent =
  `Be ready to explain your reasoning, especially on ${hintIds}.`;

// ── State ──────────────────────────────────────────────────────────────────
let state = {
  group: '',
  currentTask: 0,
  answers: {},       // taskId -> { inputs: {}, submitted: false }
  completedCount: 0,
  reviewMode: false
};

// ── Welcome screen ─────────────────────────────────────────────────────────
const groupInput = document.getElementById('group-input');
const btnStart   = document.getElementById('btn-start');

groupInput.addEventListener('input', () => {
  btnStart.disabled = groupInput.value.trim().length === 0;
});
groupInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !btnStart.disabled) startWorkshop();
});
btnStart.addEventListener('click', startWorkshop);

function startWorkshop() {
  state.group = groupInput.value.trim();
  document.getElementById('header-group').textContent = state.group;
  showScreen('screen-task');
  buildSidebar();
  renderTask(0);
}

// ── Screens ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-complete') {
    setTimeout(() => {
      const btn = document.getElementById('btn-review');
      if (btn) btn.addEventListener('click', () => {
        state.reviewMode = true;
        showScreen('screen-task');
        renderTask(0);
      });
    }, 50);
  }
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  SECTIONS.forEach(section => {
    const tasks = TASKS.filter(t => t.section === section);
    const wrap  = document.createElement('div');
    wrap.className = 'sidebar-section';
    const label = document.createElement('div');
    label.className = 'sidebar-section-label';
    label.textContent = section;
    wrap.appendChild(label);
    tasks.forEach(task => {
      const item = document.createElement('div');
      item.className = 'task-nav-item';
      item.id = `nav-${task.id}`;
      item.innerHTML = `<div class="task-num">${task.id}</div><div class="task-nav-label">${task.type}</div>`;
      item.addEventListener('click', () => { saveCurrentAnswers(); renderTask(task.id - 1); });
      wrap.appendChild(item);
    });
    sidebar.appendChild(wrap);
  });
}

function updateSidebar() {
  TASKS.forEach((task, i) => {
    const item = document.getElementById(`nav-${task.id}`);
    if (!item) return;
    item.classList.remove('active', 'completed');
    if (i === state.currentTask) item.classList.add('active');
    if (state.answers[task.id]?.submitted) item.classList.add('completed');
  });
}

// ── Render task ────────────────────────────────────────────────────────────
function renderTask(index) {
  state.currentTask = index;
  const task   = TASKS[index];
  const main   = document.getElementById('task-main');
  const saved  = state.answers[task.id] || { inputs: {}, submitted: false };
  const isLocked = saved.submitted;

  const typeClass = { Classify: 'tag-classify', Argue: 'tag-argue', Connect: 'tag-connect' }[task.type] || 'tag-classify';

  const inputsHTML = task.inputs.map(inp => {
    if (inp.kind === 'choice') {
      const opts = inp.options.map(opt => {
        const sel = saved.inputs[inp.id] === opt ? 'selected' : '';
        const lockedAttr = isLocked ? 'style="pointer-events:none;opacity:0.75;"' : '';
        const colonIdx = opt.indexOf(':');
        const optMain = colonIdx > -1 ? opt.substring(0, colonIdx).trim() : opt;
        const optSub  = colonIdx > -1 ? opt.substring(colonIdx + 1).trim() : '';
        const optHTML = optSub
          ? `<div class="choice-text-main">${optMain}</div><div class="choice-text-sub">${optSub}</div>`
          : `<div class="choice-text">${optMain}</div>`;
        return `<div class="choice-option ${sel}" data-input="${inp.id}" data-value="${opt}" ${lockedAttr}>
          <div class="choice-radio"><div class="choice-radio-dot"></div></div>
          <div>${optHTML}</div>
        </div>`;
      }).join('');
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <div class="choice-group">${opts}</div>
      </div>`;
    } else {
      const val = saved.inputs[inp.id] || '';
      const disabledAttr = isLocked ? 'disabled' : '';
      const bgStyle = isLocked ? 'style="background:#F2F4F7;color:#6B7A90;cursor:not-allowed;"' : '';
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <textarea id="ta-${inp.id}" placeholder="${inp.placeholder}" rows="4" ${disabledAttr} ${bgStyle}>${val}</textarea>
        ${!isLocked ? `<div class="char-count" id="cc-${inp.id}">${val.length} characters</div>` : ''}
      </div>`;
    }
  }).join('');

  const prevDisabled = index === 0 ? 'disabled' : '';
  const nextLabel    = index === TASK_COUNT - 1 ? (state.reviewMode ? 'Back to summary' : 'Finish') : 'Next →';
  const lockedNotice = isLocked ? `<div class="locked-notice">
    <span>✓ Submitted</span>
    <button id="btn-unsubmit" style="font-size:12px;padding:4px 12px;border:1px solid #0A6E45;background:#fff;color:#0A6E45;border-radius:5px;cursor:pointer;font-weight:600;">Unsubmit to edit</button>
  </div>` : '';

  main.innerHTML = `
    <div class="task-header">
      <div class="task-meta">
        <span class="task-number-label">Task ${task.id} of ${TASK_COUNT}</span>
        <span class="task-type-tag ${typeClass}">${task.type}</span>
        <span class="task-framework">${task.framework}</span>
      </div>
      <div class="task-question">${task.question}</div>
      <div class="task-hint">${task.hint}</div>
    </div>
    ${lockedNotice}
    <div class="${isLocked ? 'locked' : ''}">${inputsHTML}</div>
    <div class="task-footer">
      <button class="btn-secondary" id="btn-prev" ${prevDisabled}>← Previous</button>
      <div style="display:flex;gap:12px;align-items:center;">
        ${!isLocked ? `<button class="btn-submit" id="btn-submit-task">Submit this task</button>` : ''}
        <button class="btn-secondary" id="btn-next">${nextLabel}</button>
      </div>
    </div>
  `;

  // Textarea char counts
  task.inputs.filter(i => i.kind === 'textarea').forEach(inp => {
    const ta = document.getElementById(`ta-${inp.id}`);
    const cc = document.getElementById(`cc-${inp.id}`);
    if (ta && cc) ta.addEventListener('input', () => { cc.textContent = ta.value.length + ' characters'; });
  });

  // Unsubmit
  const unsubmitBtn = document.getElementById('btn-unsubmit');
  if (unsubmitBtn) {
    unsubmitBtn.addEventListener('click', () => {
      state.answers[task.id].submitted = false;
      state.reviewMode = false;
      state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
      updateProgress();
      syncToFirebase(task.id);
      renderTask(index);
    });
  }

  // Choice selection
  if (!isLocked) {
    main.querySelectorAll('.choice-option').forEach(el => {
      el.addEventListener('click', () => {
        const inputId = el.dataset.input;
        main.querySelectorAll(`.choice-option[data-input="${inputId}"]`).forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  }

  // Submit
  const submitBtn = document.getElementById('btn-submit-task');
  if (submitBtn) submitBtn.addEventListener('click', () => { if (!isLocked) submitTask(task.id); });

  // Prev / Next
  const btnPrev = document.getElementById('btn-prev');
  if (btnPrev) btnPrev.addEventListener('click', () => { if (!isLocked) saveCurrentAnswers(); if (index > 0) renderTask(index - 1); });

  document.getElementById('btn-next').addEventListener('click', () => {
    if (!isLocked) saveCurrentAnswers();
    if (index < TASK_COUNT - 1) { renderTask(index + 1); }
    else { state.reviewMode = false; showScreen('screen-complete'); }
  });

  updateSidebar();
  updateProgress();
  main.scrollTop = 0;
}

// ── Save / submit ──────────────────────────────────────────────────────────
function saveCurrentAnswers() {
  const task = TASKS[state.currentTask];
  const inputs = {};
  task.inputs.forEach(inp => {
    if (inp.kind === 'textarea') {
      const ta = document.getElementById(`ta-${inp.id}`);
      if (ta) inputs[inp.id] = ta.value;
    } else {
      const sel = document.querySelector(`.choice-option.selected[data-input="${inp.id}"]`);
      if (sel) inputs[inp.id] = sel.dataset.value;
    }
  });
  if (!state.answers[task.id]) state.answers[task.id] = { inputs: {}, submitted: false };
  state.answers[task.id].inputs = inputs;
}

function submitTask(taskId) {
  saveCurrentAnswers();
  if (!state.answers[taskId]) state.answers[taskId] = { inputs: {}, submitted: false };
  state.answers[taskId].submitted = true;
  state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
  updateSidebar();
  updateProgress();
  syncToFirebase(taskId);
  renderTask(state.currentTask);
}

// ── Firebase sync ──────────────────────────────────────────────────────────
function syncToFirebase(taskId) {
  if (!window._db || !state.group) return;
  const groupKey = state.group.replace(/[^a-zA-Z0-9]/g, '_');
  const task = TASKS[taskId - 1];
  const ans  = state.answers[taskId];
  if (!ans) return;
  const payload = {
    group:          state.group,
    taskId:         taskId,
    taskType:       task.type,
    taskSection:    task.section,
    submitted:      ans.submitted,
    inputs:         ans.inputs,
    completedCount: state.completedCount,
    timestamp:      Date.now()
  };
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/tasks/${taskId}`), payload);
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/summary`), {
    group:          state.group,
    completedCount: state.completedCount,
    lastUpdate:     Date.now()
  });
}

function updateProgress() {
  const pct = (state.completedCount / TASK_COUNT) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}
</script>
</body>
</html>
