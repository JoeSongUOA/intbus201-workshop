:root{
  --paper:#E9EEEC; --surface:#FFFFFF; --ink:#11263A; --ink2:#4A5D6D; --ink3:#7C8C98;
  --rule:#C9D2CE; --rule2:#DDE4E1; --stamp:#5B3CC4; --stamp-soft:#ECE7FB;
  --good:#16875C; --bad:#C8403B;
  --f:'Archivo LL', Arial, Helvetica, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--ink);background:#DCE3E0;overflow:hidden;font-feature-settings:"tnum" 1}
button{font-family:inherit;color:inherit}
svg.ic{display:block;flex:none}

#stage{position:absolute;left:0;top:0;width:1600px;height:900px;background:var(--paper);transform-origin:0 0;overflow:hidden}
.bar{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;padding:0 40px;gap:26px;border-bottom:1px solid var(--rule)}
.bar .course{display:flex;align-items:baseline;gap:14px;font-size:20px;color:var(--ink2);white-space:nowrap}
.bar .course b{font-weight:800;font-stretch:112%;color:var(--ink);font-size:21px}
.rounds{display:flex;align-items:center;gap:6px;list-style:none;font-size:17px;color:var(--ink3)}
.rounds .lab{margin-right:6px}
.rounds li.r{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:3px;font-weight:700;transition:background .3s,color .3s}
.rounds li.r.done{background:var(--rule2);color:var(--ink2);border-color:var(--rule2)}
.rounds li.r.now{background:var(--ink);color:#fff;border-color:var(--ink)}
.teams{margin-left:auto;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 10px;background:var(--surface);border-radius:3px;min-width:118px;border-left:6px solid}
.chip .nm{font-size:17px;color:var(--ink2);font-weight:600}
.chip .sc{margin-left:auto;font-size:24px;font-weight:800;font-stretch:108%}

.foot{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;padding:0 48px;gap:28px;border-top:1px solid var(--rule);font-size:18px;color:var(--ink2)}
.foot .join b{color:var(--ink);font-weight:700}
.foot .count{margin-left:auto;font-weight:600;color:var(--ink)}
.foot .count span{color:var(--ink2);font-weight:400}
.timer{display:flex;align-items:center;gap:14px;width:320px;opacity:0;transition:opacity .3s}
.timer.on{opacity:1}
.timer .trk{flex:1;height:8px;background:var(--rule2);border-radius:4px;overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--ink);border-radius:4px;transform-origin:left}
.timer.low .fill{background:var(--bad)}
.timer .sec{font-size:28px;font-weight:800;min-width:56px;text-align:right;color:var(--ink)}
.conn{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}
.conn.off{background:var(--bad)}
.main{position:absolute;left:0;right:0;top:76px;bottom:64px}
.fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* lobby */
.lobby{display:grid;grid-template-columns:500px 1fr;gap:60px;padding:48px 64px 32px}
.qrpanel{background:var(--surface);border-radius:8px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:22px}
.qrpanel .qr{width:400px;height:400px}
.qr svg{width:100%;height:100%;display:block}
.qrpanel .url{font-size:20px;color:var(--ink2);text-align:center;word-break:break-all;line-height:1.35}
.lobby h1{font-size:64px;font-weight:800;font-stretch:118%;line-height:1.02;letter-spacing:-.01em}
.lobby .sub{font-size:25px;color:var(--ink2);margin:16px 0 30px;line-height:1.35;max-width:860px}
.tlist{display:flex;flex-direction:column;gap:12px}
.trow{display:grid;grid-template-columns:56px 150px 1fr 110px;align-items:center;gap:18px;height:84px;background:var(--surface);border-radius:4px;padding:0 28px 0 22px;border-left:10px solid}
.trow .nm{font-size:34px;font-weight:800;font-stretch:112%}
.trow .seat{font-size:21px;color:var(--ink2)}
.trow .n{font-size:40px;font-weight:800;text-align:right}
.lobby .total{margin-top:22px;font-size:22px;color:var(--ink2)}
.lobby .total b{color:var(--ink);font-size:30px}

/* round card */
.round{display:grid;grid-template-columns:460px 1fr;height:100%;align-items:center;padding:0 96px 0 72px;gap:56px}
.round .num{font-size:440px;line-height:.8;font-weight:900;font-stretch:125%;letter-spacing:-.04em;position:relative}
.round .num small{position:absolute;left:8px;bottom:-56px;font-size:28px;font-weight:600;font-stretch:100%;letter-spacing:0;color:var(--ink2)}
.round h1{font-size:68px;font-weight:800;font-stretch:112%;line-height:1.03;letter-spacing:-.01em;max-width:900px}
.round .task{font-size:30px;line-height:1.42;color:var(--ink2);margin-top:26px;max-width:880px}
.round .rule{margin-top:36px;padding-top:22px;border-top:1px solid var(--rule);font-size:22px;color:var(--ink2);max-width:880px;line-height:1.45}
.sides{display:flex;gap:14px;margin-top:26px}
.side{flex:1;background:var(--surface);border-radius:5px;padding:16px 20px}
.side b{display:block;font-size:24px;font-weight:800;font-stretch:108%}
.side .tms{display:flex;gap:16px;margin-top:8px;font-size:20px;color:var(--ink2)}
.side .tms span{display:flex;align-items:center;gap:6px}

/* shared panels */
.ctx{background:var(--surface);border-radius:6px;padding:20px 26px;font-size:21px;line-height:1.42;color:var(--ink2)}
.ctx b.h{display:block;color:var(--ink);font-size:17px;font-weight:700;margin-bottom:6px}
.src{font-size:15px;color:var(--ink3);margin-top:8px}

/* case + track (round 1) */
.cz{position:absolute;left:48px;right:48px;top:22px;height:292px;display:grid;grid-template-columns:500px 1fr;gap:24px}
.casefile{background:var(--surface);border-radius:6px;padding:20px 24px;overflow:hidden;display:flex;flex-direction:column}
.casefile .cid{display:flex;align-items:baseline;gap:14px}
.casefile .cid b{font-size:34px;font-weight:900;font-stretch:120%}
.casefile .cid span{font-size:17px;color:var(--ink2)}
.casefile .ttl{font-size:16px;color:var(--ink2);margin:4px 0 12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.log .e{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:18.5px;line-height:1.32;padding:6px 8px;border-radius:3px}
.log .e.past{color:var(--ink2);padding-top:4px;padding-bottom:4px}
.log .e.past span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .e .d{font-weight:800;font-stretch:108%;white-space:nowrap}
.log .e.new{animation:hl 2.4s ease both}
@keyframes hl{0%,70%{background:var(--stamp-soft)}100%{background:transparent}}
.trackbox{background:var(--surface);border-radius:6px;position:relative;overflow:hidden}
.track{position:absolute;inset:0}
.track .line{position:absolute;height:4px;top:118px;background:var(--rule);border-radius:2px}
.track .prog{position:absolute;height:4px;top:118px;background:var(--ink);border-radius:2px;transition:width .8s cubic-bezier(.6,.05,.3,1)}
.track .gap{position:absolute;top:118px;height:4px;background:repeating-linear-gradient(90deg,var(--rule) 0 10px,transparent 10px 20px);opacity:0;transition:opacity .6s}
.track.broken .gap{opacity:1}
.track.broken .line.l3{opacity:0}
.st{position:absolute;top:105px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--surface);border:4px solid var(--rule);transition:border-color .5s,background .5s}
.st.lit{border-color:var(--ink);background:var(--ink)}
.st.dead{border-style:dashed}
.stl{position:absolute;top:146px;width:220px;margin-left:-110px;text-align:center;transition:opacity .5s}
.stl b{display:block;font-size:22px;font-weight:800;font-stretch:106%}
.stl span{display:block;font-size:17px;color:var(--ink2);margin-top:3px;min-height:20px}
.stl.dim{opacity:.35}
.token{position:absolute;top:40px;height:46px;width:118px;margin-left:-59px;background:var(--ink);color:#fff;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:800;font-stretch:115%;transition:left .9s cubic-bezier(.6,.05,.3,1),transform .7s cubic-bezier(.5,1.6,.5,1)}
.token:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.token.stuck{transform:translateY(22px) rotate(-7deg)}

/* stamps */
.stamp{position:absolute;top:210px;transform:translateX(-50%) rotate(-7deg);border:3px solid var(--stamp);color:var(--stamp);padding:7px 14px 6px;border-radius:5px;font-size:17px;font-weight:900;font-stretch:112%;letter-spacing:.03em;text-transform:uppercase;white-space:normal;width:max-content;max-width:236px;text-align:center;line-height:1.08;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),inset 0 0 0 4px var(--stamp);z-index:3}
.stamp.hit{animation:stamp .42s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{0%{opacity:0;transform:translateX(-50%) rotate(-7deg) scale(1.9)}60%{opacity:1}100%{opacity:1;transform:translateX(-50%) rotate(-7deg) scale(1)}}
.tag{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-size:18px;font-weight:900;font-stretch:118%;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:5px;transform:rotate(-7deg);background:rgba(255,255,255,.9);white-space:nowrap}
.tag.hit{animation:tag .42s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tag{0%{opacity:0;transform:rotate(-7deg) scale(1.9)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}

/* question area */
.qz{position:absolute;left:48px;right:48px;top:334px;bottom:14px;display:flex;flex-direction:column}
.qz.full{top:28px}
.prompt{font-size:36px;font-weight:700;line-height:1.18;letter-spacing:-.005em;max-width:1460px;margin-bottom:18px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:84px 1fr 160px;align-items:center;min-height:86px;background:var(--surface);border-radius:5px;position:relative;overflow:hidden;transition:opacity .5s,box-shadow .4s}
.opt .L{align-self:stretch;display:grid;place-items:center;font-size:44px;font-weight:900;font-stretch:125%;background:var(--rule2);transition:background .4s,color .4s}
.opt .T{padding:12px 26px;font-size:26px;line-height:1.26;display:flex;flex-direction:column;justify-content:center}
.opts.long .opt .T{font-size:23px}
.opts.long .opt{min-height:80px}
.opts.long .opt .T{padding-right:150px}
.opt .dist{height:0;margin-top:0;display:flex;border-radius:2px;overflow:hidden;width:0;transition:width .8s cubic-bezier(.6,.05,.3,1),height .3s,margin .3s}
.opts.shown .opt .dist{height:13px;margin-top:9px}
.opt .dist i{height:100%;display:block}
.opt .pc{font-size:40px;font-weight:800;font-stretch:110%;text-align:right;padding-right:28px;opacity:0;transition:opacity .4s}
.opt .pc small{font-size:18px;font-weight:600;color:var(--ink2);margin-left:4px}
.opts.shown .pc{opacity:1}
.opts.revealed .opt:not(.ok){opacity:.38}
.opt.ok{box-shadow:inset 0 0 0 4px var(--stamp)}
.opt.ok .L{background:var(--stamp);color:#fff}
.opt .okstamp{position:absolute;right:180px;top:50%;margin-top:-18px;display:none}
.opt.ok .okstamp{display:block}
.note{margin-top:14px;font-size:20px;color:var(--ink2);line-height:1.4;max-width:1380px;min-height:28px;opacity:0;transition:opacity .5s}
.note.on{opacity:1}

.opts.compact{gap:8px}
.opts.compact .opt{min-height:68px}
.opts.compact .opt .T{font-size:24px;padding:8px 22px}
.opts.compact .opt .L{font-size:36px}
.opts.compact .opt .pc{font-size:34px}
/* discussion box */
.qbox{background:var(--ink);color:#fff;border-radius:6px;padding:44px 52px;display:grid;grid-template-columns:1fr 250px;gap:48px;align-items:center}

.factrow{display:grid;gap:14px;margin-bottom:22px}
.fact{background:var(--surface);border-radius:6px;padding:20px 24px;font-size:22px;line-height:1.38}

/* bars (share of GDP etc.) */
.vz{position:absolute;left:48px;right:48px;top:22px;height:250px;display:grid;grid-template-columns:440px 1fr;gap:24px}
.bars{background:var(--surface);border-radius:6px;padding:22px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative}

.brow .fl{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width 1.1s cubic-bezier(.6,.05,.3,1)}

.brow .vl{font-size:24px;font-weight:800;font-stretch:108%}

.bars .src{position:absolute;right:30px;bottom:10px;margin:0}
.qz.nz{top:296px}

/* number histogram */
.hist{position:relative;height:250px;margin-top:4px;background:var(--surface);border-radius:6px}

/* hub diagram (integrated case) */
.hub{position:absolute;inset:0}

/* wrap-up */
.wrapz{position:absolute;inset:0;padding:34px 48px 20px;display:flex;flex-direction:column}

.wgrid{display:grid;grid-template-columns:460px 1fr;gap:24px;flex:1;min-height:0}
.wcls{background:var(--ink);color:#fff;border-radius:6px;padding:24px 26px;display:flex;flex-direction:column;gap:18px}
.wcls .h{font-size:17px;font-weight:700;color:rgba(255,255,255,.7)}
.wrow{border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.wrow .lbl{font-size:17px;color:rgba(255,255,255,.75)}
.wrow .big{font-size:48px;font-weight:900;font-stretch:115%;line-height:1.05;margin-top:4px}
.wrow .sm{font-size:17px;color:rgba(255,255,255,.8);line-height:1.35;margin-top:4px}
.wcards{display:flex;flex-direction:column;gap:14px}
.wcard{background:var(--surface);border-radius:6px;padding:20px 26px;border-left:6px solid var(--stamp)}

/* ---------- static slides ---------- */

.sl{position:absolute;inset:0;padding:56px 72px 30px;display:flex;flex-direction:column}

.route{display:flex;align-items:center;gap:12px;margin-top:22px}

.stat{min-height:0!important}
/* cover */
.cov{position:absolute;inset:0;overflow:hidden;background:var(--ink)}

.cov .wkc{display:inline-block;margin-top:30px;border:3px solid #fff;border-radius:5px;padding:6px 16px;font-size:24px;font-weight:900;font-stretch:118%;letter-spacing:.05em;text-transform:uppercase;transform:rotate(-4deg)}

.chart .nt{font-size:16px;color:var(--ink2);margin-top:2px}
.chart svg{display:block;margin-top:8px}
.hq{margin-top:24px;background:var(--ink);color:#fff;border-radius:6px;padding:30px 40px;font-size:34px;font-weight:700;line-height:1.25}

.wks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.fw{display:grid;grid-template-columns:600px 1fr;gap:28px;flex:1;min-height:0}

.lbrows{position:relative;margin-top:36px;height:520px}
.lbrow{position:absolute;left:0;right:0;height:112px;display:grid;grid-template-columns:110px 1fr 220px;align-items:center;transition:top .9s cubic-bezier(.6,.05,.3,1)}
.lbrow .rk{font-size:84px;font-weight:900;font-stretch:125%;line-height:1}
.lbrow .bw{position:relative;height:84px}
.lbrow .b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;gap:14px;padding-left:22px;min-width:260px;transition:width 1s cubic-bezier(.6,.05,.3,1);color:#fff}
.lbrow .b b{font-size:34px;font-weight:800;font-stretch:112%}
.lbrow .b span{font-size:19px;opacity:.88}
.lbrow .v{text-align:right}
.lbrow .v b{display:block;font-size:56px;font-weight:900;font-stretch:112%;line-height:1}
.lbrow .v span{font-size:17px;color:var(--ink2)}

/* rank + poll results */
.rk4{display:flex;flex-direction:column;gap:10px}
.pausebox{height:100%;display:grid;place-items:center;text-align:center}
.pausebox h1{font-size:72px;font-weight:800;font-stretch:115%}
.pausebox p{font-size:26px;color:var(--ink2);margin-top:16px}

/* overlay */
.ov{position:absolute;inset:0;background:rgba(17,38,58,.92);display:none;place-items:center;z-index:9}
.ov.on{display:grid}
.ov .card{background:var(--surface);border-radius:8px;padding:40px;display:flex;gap:40px;align-items:center}
.ov .card .qr{width:360px;height:360px}
.ov .card h2{font-size:48px;font-weight:800;font-stretch:115%}
.ov .card p{font-size:22px;color:var(--ink2);margin-top:12px;max-width:520px;word-break:break-all}

/* control */
body.control{overflow:auto;background:var(--paper)}
.ctl{max-width:760px;margin:0 auto;padding:16px 16px 60px;font-size:16px}
.ctl header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.ctl header h1{font-size:18px;font-weight:800;font-stretch:112%}
.ctl header .m{margin-left:auto;color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:8px}
.cc{background:var(--surface);border-radius:6px;padding:16px;margin-bottom:12px}
.ctl .stepname{font-size:13px;color:var(--ink2)}
.ctl .steptitle{font-size:20px;font-weight:700;line-height:1.3;margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--rule2);margin-top:8px}
.pill.open{background:#DFF2E9;color:var(--good)}.pill.closed{background:#FBEBD0;color:#8A5E00}.pill.revealed{background:var(--stamp-soft);color:var(--stamp)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:5px;min-height:52px;padding:6px;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.btn.primary{grid-column:1/-1;min-height:72px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:21px}
.btn.primary:hover{background:#1d3a55}
.btn.warn{color:var(--bad)}
.key{font-size:15px;line-height:1.5}
.key b{color:var(--stamp)}
.key .n{color:var(--ink2);margin-top:8px}
.tc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tc div{border-left:5px solid;padding:4px 8px;font-size:13px;color:var(--ink2)}
.tc div b{display:block;font-size:20px;color:var(--ink)}
.steps{list-style:none}
.steps li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--rule2);cursor:pointer;font-size:14px}
.steps li:hover{background:var(--paper)}
.steps li.cur{font-weight:800}
.steps li .i{width:26px;color:var(--ink3);font-size:12px}
.h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.sub-i{border-left:5px solid;padding:8px 10px;margin-top:8px;background:var(--paper);border-radius:0 4px 4px 0}
.sub-i .meta{font-size:12px;color:var(--ink2)}
.sub-i .t{font-size:15px;margin:3px 0 6px}
.sub-i button{font-size:13px;min-height:34px;padding:0 12px;margin-right:6px}
.sub-i.star{outline:2px solid var(--stamp)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="stage"></div>
<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);

    _this.createASCII = function(cellSize, margin) {

// ---------------- scoring ----------------
function numberPoints(st, v){
  if (typeof v !== "number") return 0;
  const d = v < st.truth.lo ? st.truth.lo - v : (v > st.truth.hi ? v - st.truth.hi : 0);
  for (const [lim, pts] of st.bands) if (d <= lim) return pts;
  return 0;
}
function scoreOf(st, a){
  if (a == null) return 0;
  if (st.type === "choice") return a === st.correct ? (st.points||10) : 0;
  if (st.type === "number") return numberPoints(st, a);
  if (st.type === "alloc") return Array.isArray(a) ? (a[st.key]||0) * (st.perPoint||2) : 0;
  return 0;
}
function voteTally(items, ans){
  const counts = items.map(() => 0);
  Object.values(ans||{}).forEach(k => { if (counts[k] != null) counts[k]++; });
  const order = counts.map((c,i) => [c,i]).sort((a,b) => b[0]-a[0] || a[1]-b[1]).map(x => x[1]);
  return { counts, order };
}

// Places with ties: equal vote counts share the higher place. Items with no votes earn nothing.
function votePlaces(items, ans, awards){
  const { counts } = voteTally(items, ans);
  const place = counts.map(c => counts.filter(x => x > c).length);
  const award = counts.map((c,i) => c > 0 ? (awards[place[i]] || 0) : 0);
  const tie = place.map((p,i) => place.filter(q => q === p).length > 1);
  return { counts, place, award, tie };
}
const PLACE = ["1st","2nd","3rd","4th","5th","6th"];
const placeLabel = (p, tie) => (tie ? "=" : "") + (PLACE[p] || (p+1)+"th");

async function goto(i){

}
function payload(st){
  const c = { id:st.id, kind:st.type, prompt:st.prompt };
  if (["choice","poll","rank","alloc"].includes(st.type)) c.options = st.options;
  if (st.type === "number") Object.assign(c, { min:st.min, max:st.max, step:st.step||1, unit:st.unit||"" });
  if (st.type === "alloc") c.budget = st.budget || 10;
  if (st.type === "text") Object.assign(c, { maxLen:st.maxLen||160, sides: st.sides.map(s => ({ id:s.id, label:s.label, teams:s.teams, evidence:s.evidence })) });
  if (st.type === "vote") c.items = shortlistItems();
  return c;
}
function shortlistItems(){
  return Object.entries(S.shortlist||{}).map(([pid,v]) => ({ pid, ...v })).sort((a,b) => a.ts - b.ts)
    .map(x => ({ pid:x.pid, team:x.team, side:x.side, ev:x.ev, text:x.text }));
}

}
async function closeAnswers(){ if (S.state.status === "open") await B.update("", { "state/status":"closed" }); }
async function reveal(){
  const st = stepNow(); if (!ASK.has(st.type) || UNSCORED.has(st.type)) return;
  const upd = {}, teamPts = {};
  CFG.teams.forEach(t => teamPts[t.id] = 0);
  const ans = S.answers || {};
  if (st.type === "vote"){
    const items = (S.current && S.current.items) || [];
    const { counts, place, award, tie } = votePlaces(items, ans, st.awards || []);
    items.forEach((it,i) => { if (award[i] > 0){ teamPts[it.team] = (teamPts[it.team]||0) + award[i]; upd[`playerPoints/${it.pid}/${st.id}`] = award[i]; } });
    const firsts = items.map((it,i) => i).filter(i => place[i] === 0 && counts[i] > 0);
    const top = firsts.length ? items[firsts[0]] : null;
    upd[`reveal/${st.id}`] = { kind:"vote", counts, place, award, tie, items, top: top ? { team:top.team, text:top.text } : null, n:Object.keys(ans).length };
  } else {
    const opened = (S.state.openedAt||0) + 1000;
    const n = {}, sum = {};
    CFG.teams.forEach(t => { n[t.id] = 0; sum[t.id] = 0; });
    for (const pid in S.players){ const p = S.players[pid]; if ((p.t||0) <= opened && n[p.team] != null) n[p.team]++; }
    for (const pid in ans){
      const pts = scoreOf(st, ans[pid]);
      upd[`playerPoints/${pid}/${st.id}`] = pts;
      const p = S.players[pid];
      if (p && (p.t||0) <= opened && sum[p.team] != null) sum[p.team] += pts;
    }
    CFG.teams.forEach(t => teamPts[t.id] = n[t.id] ? Math.round(100*sum[t.id]/n[t.id])/100 : 0);
    const r = { kind:st.type };
    const vals = Object.values(ans); r.n = vals.length;
    if (st.type === "choice"){ r.correct = st.correct; r.pc = pct(vals.filter(v => v === st.correct).length, vals.length); }
    if (st.type === "number"){
      Object.assign(r, { lo:st.truth.lo, hi:st.truth.hi, label:st.truth.label });
      const nums = vals.filter(v => typeof v === "number").sort((a,b) => a-b);
      r.median = nums.length ? nums[Math.floor((nums.length-1)/2)] : null;
      r.within = pct(nums.filter(v => numberPoints(st, v) >= st.bands[0][1]).length, nums.length);
    }
    if (st.type === "alloc"){ r.key = st.key; const arr = vals.filter(Array.isArray); r.avgKey = arr.length ? Math.round(10*arr.reduce((s,a) => s + (a[st.key]||0), 0)/arr.length)/10 : 0; }
    upd[`reveal/${st.id}`] = r;
  }
  upd[`scored/${st.id}`] = teamPts;
  upd["state/status"] = "revealed";
  await B.update("", upd);
  S.scored = { ...S.scored, [st.id]:teamPts };
  const board = {}; ranked().forEach((t,i) => board[t.id] = { score: Math.round(t.score*10)/10, rank:i+1, members:t.members });
  await B.set("board", board);
}
async function extend(sec){ if (S.state.status === "open") await B.update("", { "state/duration": (S.state.duration||0) + sec }); }
async function advance(){
  const st = stepNow(), s = S.state.status;
  if (ASK.has(st.type)){
    if (s === "idle") return openAnswers();
    if (s === "open") return closeAnswers();
    if (s === "closed" && !UNSCORED.has(st.type)) return reveal();

}

}

const SKILL = { fire:1.25, earth:0.85, air:1.1, water:1.0 };
function simJoin(n){
  const ids = CFG.teams.map(t => t.id), w = [0.26,0.25,0.24,0.25], upd = {};
  for (let i = 0; i < n; i++){
    let r = Math.random(), k = 0; while (k < 3 && r > w[k]){ r -= w[k]; k++; }
    upd[`players/sim${String(i).padStart(3,"0")}`] = { team: ids[k], t: Date.now() - 60000 };
  }
  return B.update("", upd);
}
function pickW(w){ const s = w.reduce((a,b) => a+b, 0); let r = Math.random()*s, k = 0; while (k < w.length-1 && r > w[k]){ r -= w[k]; k++; } return k; }
function gauss(){ return Math.sqrt(-2*Math.log(Math.random()||1e-9))*Math.cos(2*Math.PI*Math.random()); }
function simAnswer(st, team, idx){
  const sk = SKILL[team] || 1;
  if (st.type === "choice" || st.type === "poll"){ const w = (st.demo || st.options.map(() => 1)).slice(); if (st.correct != null) w[st.correct] *= sk; return pickW(w); }
  if (st.type === "number"){ const mid = (st.truth.lo + st.truth.hi)/2, s = Math.max(0, (sk-0.8)*0.9); let v = (st.demoMean + st.demoSd*gauss())*(1-s) + mid*s; return Math.max(st.min, Math.min(st.max, Math.round(v))); }
  if (st.type === "alloc"){ const w = st.demo.slice(); w[st.key] *= sk; const a = st.options.map(() => 0); for (let i = 0; i < st.budget; i++) a[pickW(w)]++; return a; }
  if (st.type === "rank"){ const a = st.options.map((_,i) => i); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
  if (st.type === "text"){ const sd = sideOf(st, team); const ev = Math.floor(Math.random()*3); return { ev, text: st.demoTexts[sd.id][ev] }; }
  if (st.type === "vote"){ const items = (S.current && S.current.items) || []; const w = items.map((it,i) => it.team === team ? 0 : 1 + ((i*7)%5)); if (!w.some(x => x > 0)) return null; return pickW(w); }
  return null;
}
const simDone = new Set();
function simWatch(){
  setInterval(() => {
    const st = stepNow();
    if (S.state.status !== "open" || !ASK.has(st.type) || simDone.has(st.id)) return;
    simDone.add(st.id);
    const dur = (S.state.duration||20)*1000, bots = Object.entries(S.players||{}).filter(([id]) => id.startsWith("sim"));
    const rate = st.type === "text" ? 0.55 : 0.94;
    const queue = bots.filter(() => Math.random() < rate).map(([id,p],i) => ({ id, v: simAnswer(st, p.team, i), at: Date.now() + dur*(0.1 + 0.6*Math.pow(Math.random(),1.6)) }))
      .filter(q => q.v != null).sort((a,b) => a.at - b.at);
    const t = setInterval(() => {
      if (S.state.status !== "open" || stepNow().id !== st.id){ clearInterval(t); return; }
      const now = Date.now(), upd = {};
      while (queue.length && queue[0].at <= now){ const q = queue.shift(); upd[`answers/${st.id}/${q.id}`] = q.v; }
      if (Object.keys(upd).length) B.update("", upd);
      if (!queue.length) clearInterval(t);
    }, 250);
  }, 200);
}

      else if (q.type === "alloc"){ r.append(h("div","big",`${fmt1(rv.avgKey)} of 10`), h("div","sm",`average points placed on ${L(q.key)}, the best-supported explanation`)); }

    });

};

function lineChart(o){
  const W = 690, H = 300, L = 56, R = 40, T = 34, B = 40, pw = W-L-R, ph = H-T-B;
  const x = v => L + (v - o.xmin)/(o.xmax - o.xmin)*pw, y = v => T + ph - (v - o.ymin)/(o.ymax - o.ymin)*ph;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Archivo LL, Arial" aria-hidden="true">`;
  o.yticks.forEach(t => { s += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#DDE4E1"/><text x="${L-12}" y="${y(t)+5}" text-anchor="end" font-size="15" fill="#4A5D6D">${t}</text>`; });
  o.xticks.forEach(t => { s += `<text x="${x(t)}" y="${H-10}" text-anchor="middle" font-size="15" fill="#4A5D6D">${t}</text>`; });
  const pts = o.points.map(p => `${x(p[0])},${y(p[1])}`).join(" ");
  s += `<polyline points="${pts}" fill="none" stroke="${o.colour}" stroke-width="4" stroke-linejoin="round"/>`;
  o.points.forEach((p,i) => { s += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="7" fill="${o.colour}"/><text x="${x(p[0]) + ((o.dx||[])[i]||0)}" y="${(o.below||[])[i] ? y(p[1])+30 : y(p[1])-16}" text-anchor="${(o.anchor||[])[i] || (i === o.points.length-1 ? "end" : (i === 0 ? "start" : "middle"))}" font-size="${o.big ? 22 : 20}" font-weight="800" fill="#11263A">${o.fmt ? o.fmt(p,i) : p[1]}</text>`; });
  return s + `</svg>`;
}

function once(p){ return new Promise(res => { let un = null, done = false; un = B.on(p, v => { if (done) return; done = true; res(v == null ? {} : v); setTimeout(() => { if (typeof un === "function") un(); }, 0); }); }); }

async function exportReview(){
  const btn = C.exportBtn; btn.disabled = true; btn.textContent = "Building review page…";
  try {
    const [answers, players, scored, reveals] = await Promise.all([once("answers"), once("players"), once("scored"), once("reveal")]);
    const team = pid => (players[pid]||{}).team;
    const totals = {}, members = {};
    CFG.teams.forEach(t => { totals[t.id] = 0; members[t.id] = 0; });
    Object.values(players).forEach(p => { if (members[p.team] != null) members[p.team]++; });
    Object.values(scored).forEach(sc => { for (const k in sc) if (totals[k] != null) totals[k] += sc[k]; });
    const standings = CFG.teams.map(t => ({ ...t, score: totals[t.id], members: members[t.id] })).sort((a,b) => b.score - a.score);
    const mx = Math.max(1, ...standings.map(t => t.score));
    let body = "";
    body += `<section class="stand"><h2>Final standings</h2>${standings.map((t,i) => `<div class="srow"><span class="rk">${i+1}</span><span class="sb" style="width:${24+76*t.score/mx}%;background:${t.colour}">${esc(t.name)} <small>${t.members} members</small></span><b>${(Math.round(t.score*10)/10).toFixed(1)}</b></div>`).join("")}<p class="fine">Each question's points were averaged within the delegation, so larger delegations had no advantage.</p></section>`;
    const ctxHtml = st => {
      let o = "";
      if (st.ctx) o += `<div class="ctx"><b>${esc(st.ctx.h)}</b>${esc(st.ctx.t)}</div>`;
      if (st.case){ const cs = CFG.cases[st.case], n = (st.vis.after || st.vis.now || {}).log || 0; o += `<div class="ctx"><b>${esc(cs.id)}${cs.title ? ": " + esc(cs.title) : ""}</b><ul class="log">${cs.log.slice(0,n).map(e => `<li><span>${esc(e.d)}</span>${esc(e.t)}</li>`).join("")}</ul></div>`; }
      if (st.bars) o += `<div class="ctx"><b>Data</b><ul class="log">${st.bars.rows.map(r => `<li><span>${esc(r.label)}</span>${esc(r.sub)}: ${esc(r.text)}</li>`).join("")}</ul><div class="src">${esc(st.bars.src||"")}</div></div>`;
      return o;
    };
    for (const st of STEPS){
      const ans = answers[st.id] || {}, rv = reveals[st.id] || {};
      if (st.type === "round"){ body += `<h2 class="rnd"><span>Round ${st.round}</span>${esc(st.title)}</h2><p class="task">${esc(st.task)}</p>`; continue; }
      if (st.type === "slide"){
        if (st.layout === "hook") body += `<section class="wrap"><h3>${esc(st.title)}</h3><div class="card"><b>${esc(st.ab.label)}</b><p>${st.ab.points.map(p => `${Math.floor(p[0])}: ${p[1]}`).join(" | ")}. ${esc(st.ab.note)}</p></div><div class="card"><b>${esc(st.rta.label)}</b><p>${st.rta.points.map((p,i) => `${esc(st.rta.labels[i])}: ${p[1]}`).join(" | ")}</p></div><div class="card"><b>The puzzle</b><p>${esc(st.question)}</p></div><div class="src">${esc(st.src)}</div></section>`;
        if (st.layout === "frameworks") body += `<section class="wrap"><h3>${esc(st.title)}</h3><div class="card"><b>Types of regional economic integration</b><p>${st.ladder.map(x => `${esc(x.n)}: ${esc(x.d)}`).join(". ")}.</p></div>${st.pairs.map(p => `<div class="card"><b>${esc(p.q)}</b><p><strong>${esc(p.a.h)}.</strong> ${esc(p.a.t)} <strong>${esc(p.b.h)}.</strong> ${esc(p.b.t)}</p></div>`).join("")}<div class="src">Source: ${esc(st.src)}</div></section>`;
        if (st.layout === "actions") body += `<section class="wrap"><h3>${esc(st.title)}</h3>${st.items.map((x,i) => `<div class="card"><b>${String(i+1).padStart(2,"0")} ${esc(x.h)}</b><p>${esc(x.t)}</p></div>`).join("")}<div class="src">Source: ${esc(st.src)}</div></section>`;
        continue;
      }
      if (st.type === "choice" || st.type === "poll"){
        const n = st.options.length, cnt = Array(n).fill(0), by = Array.from({length:n}, () => ({}));
        for (const pid in ans){ const k = ans[pid]; if (cnt[k] == null) continue; cnt[k]++; const t = team(pid); by[k][t] = (by[k][t]||0) + 1; }
        const tot = cnt.reduce((a,b) => a+b, 0);
        body += `<article class="q"><div class="kind">${st.type === "poll" ? "Class vote (no single correct answer)" : "Question"}</div>${ctxHtml(st)}<h3>${esc(st.prompt)}</h3><ol class="opts">${st.options.map((o,i) => `<li class="${st.correct === i ? "ok" : ""}"><span class="L">${String.fromCharCode(65+i)}</span><div class="T">${esc(o)}${st.correct === i ? ' <em class="tag">Correct</em>' : ""}${teamBar(by[i], tot)}</div><b>${tot ? Math.round(100*cnt[i]/tot) : 0}%</b></li>`).join("")}</ol>${st.reveal ? `<p class="exp"><b>Explanation.</b> ${esc(st.reveal)}</p>` : ""}${st.type === "poll" && st.notes ? `<p class="exp"><b>Points for each option.</b> ${esc(st.notes)}</p>` : ""}<p class="fine">${tot} answers</p></article>`;
      }
      if (st.type === "number"){
        const vals = Object.entries(ans).filter(([,v]) => typeof v === "number");
        const nb = Math.floor((st.max - st.min)/st.bin) + 1, bins = Array.from({length:nb}, () => ({})), bt = Array(nb).fill(0);
        vals.forEach(([pid,v]) => { const b = Math.min(nb-1, Math.floor((v - st.min)/st.bin)); const t = team(pid); bins[b][t] = (bins[b][t]||0) + 1; bt[b]++; });
        const m2 = Math.max(1, ...bt);
        const hist = `<div class="hist">${bt.map((c,b) => { const lo = st.min + b*st.bin, hi = st.bin === 1 ? lo : Math.min(st.max, lo + st.bin - 1); const tr = hi >= st.truth.lo && lo <= st.truth.hi; return `<div class="hc${tr ? " tr" : ""}" title="${lo}${st.bin>1 ? "–"+hi : ""}${esc(st.unit)}: ${c}"><div class="stk" style="height:${100*c/m2}%">${CFG.teams.map(t => bins[b][t.id] ? `<i style="flex:${bins[b][t.id]};background:${t.colour}"></i>` : "").join("")}</div></div>`; }).join("")}</div><div class="axis"><span>${st.min}${esc(st.unit)}</span><span>${st.max}${esc(st.unit)}</span></div>`;
        body += `<article class="q"><div class="kind">Estimate</div>${ctxHtml(st)}<h3>${esc(st.prompt)}</h3><div class="ans"><em class="tag">Answer</em> ${esc(st.truth.label)}</div>${hist}<p class="fine">Class median: ${rv.median != null ? rv.median + esc(st.unit) : "–"}. ${rv.within != null ? rv.within + "% within " + st.bands[0][0] + " points." : ""} ${vals.length} estimates. The highlighted column contains the answer.</p><p class="exp"><b>Explanation.</b> ${esc(st.reveal)}</p></article>`;
      }
      if (st.type === "alloc"){
        const n = st.options.length, sum = Array(n).fill(0), by = Array.from({length:n}, () => ({})); let k = 0;
        for (const pid in ans){ const a = ans[pid]; if (!Array.isArray(a)) continue; k++; const t = team(pid); a.forEach((v,i) => { sum[i] += v||0; by[i][t] = (by[i][t]||0) + (v||0); }); }
        body += `<article class="q"><div class="kind">Split 10 points</div>${ctxHtml(st)}<h3>${esc(st.prompt)}</h3><ol class="opts">${st.options.map((o,i) => `<li class="${st.key === i ? "ok" : ""}"><span class="L">${String.fromCharCode(65+i)}</span><div class="T">${esc(o)}${st.key === i ? ' <em class="tag">Best supported</em>' : ""}<div class="tb" style="width:${k ? 10*sum[i]/k : 0}%">${CFG.teams.map(t => by[i][t.id] ? `<i style="flex:${by[i][t.id]};background:${t.colour}"></i>` : "").join("")}</div></div><b>${k ? (sum[i]/k).toFixed(1) : "0.0"}<small> pts</small></b></li>`).join("")}</ol><p class="exp"><b>Explanation.</b> ${esc(st.reveal)}</p><p class="fine">Average points placed on each explanation, from ${k} students.</p></article>`;
      }
      if (st.type === "vote"){
        const src = STEP[st.source], items = rv.items || shortlistItems(), cnt = items.map(() => 0);
        Object.values(ans).forEach(i => { if (cnt[i] != null) cnt[i]++; });
        const tot = cnt.reduce((a,b) => a+b, 0), vp = votePlaces(items, ans, st.awards);
        body += `<article class="q"><div class="kind">Argument vote</div>${ctxHtml(src)}<h3>${esc(src.prompt)}</h3><p class="fine">The best argument from each delegation, written anonymously by students, with the class vote.</p><div class="args">${items.map((it,i) => { const t = TEAM[it.team] || {}, sd = (src.sides||[]).find(s => s.id === it.side) || {}, aw = vp.award[i]; return `<div class="arg" style="border-top-color:${t.colour}"><div class="meta">${esc(t.name)}${sd.label ? " | " + esc(sd.label) : ""}${(sd.evidence||[])[it.ev] ? " | " + esc(sd.evidence[it.ev]) : ""}</div><p>${esc(it.text)}</p><div class="meta">${cnt[i]} votes (${tot ? Math.round(100*cnt[i]/tot) : 0}%)${aw > 0 ? ` <em class="tag">${placeLabel(vp.place[i], vp.tie[i])} +${aw}</em>` : ""}</div></div>`; }).join("")}</div></article>`;
      }
      if (st.type === "wrap"){
        body += `<section class="wrap"><h3>${esc(st.title)}</h3>${st.cards.map(c => `<div class="card"><b>${esc(c.h)}</b><p>${esc(c.t)}</p>${c.src ? `<div class="src">Source: ${esc(c.src)}</div>` : ""}</div>`).join("")}</section>`;
      }
    }
    const html = `<!DOCTYPE html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(CFG.course)} ${esc(CFG.week)} Lecture Live review</title><style>${fontCss()}

</style></head><body><main><header><h1>${esc(CFG.course)} ${esc(CFG.week)}: ${esc(CFG.topic)}</h1><p>Lecture Live review. Every question from this lecture with the class results, correct answers, explanations and sources.</p><div class="legend">${CFG.teams.map(t => `<span><i style="background:${t.colour}"></i>${esc(t.name)}</span>`).join("")}<span>Bar colours show which delegation gave each answer.</span></div></header>${body}</main></body></html>`;

(async function(){
  B = await createBackend("lecture/" + SID, DEMO);
  window.LL = { advance, back, goto, openAnswers, closeAnswers, reveal, simJoin, simShortlist, star, resetSession, exportReview, S, STEPS, stepNow };
  let queued = false;
  const render = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; VIEW === "control" ? renderControl() : renderScreen(); }); };
  if (VIEW === "control"){ document.body.className = "control"; $("#stage").remove(); const c = h("div","ctl"); c.id = "ctl"; document.body.append(c); buildControl(); }
  else { buildChrome(); fitStage(); addEventListener("resize", fitStage); setInterval(tick, 100); }
  B.onConn(v => { S.conn = v; render(); });
  B.on("state", v => {
    S.state = v || { step:0, status:"idle" };
    const st = stepNow();
    if (ansFor !== st.id){ if (ansUnsub) ansUnsub(); ansFor = st.id; S.answers = {}; ansUnsub = B.on("answers/" + st.id, a => { S.answers = a || {}; render(); }); }
    render();
  });
  B.on("players", v => { S.players = v || {}; render(); });
  B.on("scored", v => { S.scored = v || {}; render(); });
  B.on("shortlist", v => { S.shortlist = v || {}; render(); });
  B.on("current", v => { S.current = v; render(); });
  B.on("reveal", v => { S.reveals = v || {}; render(); });
  await writeMeta();
  autoClose();
  if (SIM) simWatch();
  if (VIEW !== "control"){
    addEventListener("keydown", e => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); advance(); }
      else if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); back(); }
      else if (e.key === "f" || e.key === "F"){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
      else if (e.key === "q" || e.key === "Q"){ $("#ov").classList.toggle("on"); }
    });
  }
})();
