<script>
// ════════════════════════════════════════════════════════════════════════════
//  WEEK CONFIG — EDIT THIS SECTION ONLY
//  Copy this file, change the values below, and deploy.
// ════════════════════════════════════════════════════════════════════════════
const WEEK_CONFIG = {

  // ── Identity ──────────────────────────────────────────────────────────────
  week:         4,
  title:        'Occidental Petroleum',
  caseRef:      'Integrative Case 1.8 · Peng (2023), pp. 146–150',

  // ── Firebase path — MUST be unique per week ───────────────────────────────
  // Pattern: 'sessions/weekN'  e.g. 'sessions/week5'
  firebasePath: 'sessions/week4',

  // ── Tasks ─────────────────────────────────────────────────────────────────
  // type:     "Classify" | "Argue" | "Connect"
  // inputs[].kind:  "choice" | "textarea"
  // inputs[].options:  required for kind:"choice"
  // inputs[].placeholder:  required for kind:"textarea"
  tasks: [
    {
      id: 1,
      section: 'Value Chain Matrix',
      type: 'Classify',
      framework: 'Value Chain Matrix',
      question: 'Using the Value Chain Matrix, place enhanced oil recovery and chlorine manufacturing in the appropriate cells. Do they belong in the same cell, and if not, what is the deciding factor?',
      hint: 'Consider both axes independently for each activity: industry specificity (industry-specific vs. common across industries) and proprietary nature (proprietary vs. commoditised).',
      inputs: [
        { id: 'eor_cell', kind: 'choice', label: 'Enhanced oil recovery — cell placement', options: ['Cell 1 (Outsource)', 'Cell 2 (Outsource)', 'Cell 3 (In-House)', 'Cell 4 (???)'] },
        { id: 'chlorine_cell', kind: 'choice', label: 'Chlorine manufacturing — cell placement', options: ['Cell 1 (Outsource)', 'Cell 2 (Outsource)', 'Cell 3 (In-House)', 'Cell 4 (???)'] },
        { id: 'deciding_factor', kind: 'textarea', label: 'What is the deciding factor that puts them in different cells (if they differ)? Explain using both axes.', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 2,
      section: 'Value Chain Matrix',
      type: 'Connect',
      framework: 'Value Chain Matrix',
      question: 'What does the difference in cell placement between the two activities imply about which activities Oxy should protect, and what would happen if it treated them the same way?',
      hint: 'Think about what "protecting" an activity means in the Value Chain Matrix logic, and what the cost of misclassification would be.',
      inputs: [
        { id: 'implication', kind: 'textarea', label: 'Your analysis', placeholder: 'Connect the cell placements to a strategic implication...' }
      ]
    },
    {
      id: 3,
      section: 'VRIO',
      type: 'Classify',
      framework: 'VRIO Framework',
      question: 'Is Oxy\'s low-cost production capability rare? What would need to be true for it to fail this test?',
      hint: 'Rarity does not require uniqueness, it only requires that the capability is not widely distributed among competitors. Use the case evidence about Oxy\'s position in the industry.',
      inputs: [
        { id: 'rare_verdict', kind: 'choice', label: 'Does Oxy\'s low-cost production capability pass the Rarity test?', options: ['Yes, it is rare', 'No, it is not rare', 'Partially, it depends on the time period'] },
        { id: 'rare_reasoning', kind: 'textarea', label: 'What case evidence supports your verdict? What would need to change for it to fail?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 4,
      section: 'VRIO',
      type: 'Classify',
      framework: 'VRIO Framework',
      question: 'Is Oxy\'s low-cost production capability hard to imitate? Which mechanism, causal ambiguity, social complexity, or complementary assets, best explains the barrier?',
      hint: 'Causal ambiguity = rivals cannot identify what causes the advantage. Social complexity = the advantage is embedded in invisible relationships. Complementary assets = the advantage depends on a combination of assets that only generate value together.',
      inputs: [
        { id: 'imitate_mechanism', kind: 'choice', label: 'Which mechanism best explains the imitability barrier?', options: ['Causal ambiguity', 'Social complexity', 'Complementary Assets', 'A combination of all three'] },
        { id: 'imitate_reasoning', kind: 'textarea', label: 'Why does this mechanism apply to Oxy? Use specific case evidence.', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 5,
      section: 'VRIO',
      type: 'Classify',
      framework: 'VRIO Framework',
      question: 'Is Oxy organised to exploit its low-cost production capability? What specific organisational features does the case point to?',
      hint: 'Organisation asks whether the firm\'s structure, processes, and management enable it to capture value from the capability, not whether the capability exists.',
      inputs: [
        { id: 'org_verdict', kind: 'choice', label: 'Does Oxy pass the Organisation test?', options: ['Yes, clearly organised to exploit it', 'Partially, some evidence, some gaps', 'No, the case does not support this'] },
        { id: 'org_evidence', kind: 'textarea', label: 'What specific organisational features does the case point to?', placeholder: 'Cite specific evidence from the case...' }
      ]
    },
    {
      id: 6,
      section: 'VRIO',
      type: 'Connect',
      framework: 'VRIO Framework',
      question: 'Oxy consistently sought new oil field acquisitions throughout the 1990s and 2000s. Which VRIO dimension does this pattern suggest Oxy was most concerned about, and why?',
      hint: 'Think about what continuous acquisition signals about how Oxy understood the durability of its existing advantage.',
      inputs: [
        { id: 'acquisition_dimension', kind: 'choice', label: 'Which VRIO dimension does the acquisition pattern most directly address?', options: ['Value', 'Rarity', 'Imitability', 'Organisation'] },
        { id: 'acquisition_reasoning', kind: 'textarea', label: 'Why does this dimension explain the pattern? What does it imply about the long-run durability of Oxy\'s advantage?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 7,
      section: 'Location-Mode Matrix',
      type: 'Classify',
      framework: 'Location-Mode Matrix',

      hint: 'The Location-Mode Matrix has two axes: location (domestic vs. foreign) and mode (in-house vs. outsourcing). Think about what Oxy was doing before and after the transaction.',
      inputs: [
        { id: 'argentina_cell', kind: 'choice', label: 'Where did Oxy\'s Argentine operations sit before the sale?', options: ['Cell 1, Captive sourcing / FDI (foreign, in-house)', 'Cell 2, Offshoring (foreign, outsourced)', 'Cell 3, Domestic in-house', 'Cell 4, Onshoring (domestic, outsourced)'] },
        { id: 'argentina_reasoning', kind: 'textarea', label: 'Justify your placement and explain what the sale to Sinopec represents as a strategic move.', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 8,
      section: 'Domestic vs. International',
      type: 'Argue',
      framework: 'Debate 1, Section 4-4',
      question: 'What is the strongest case-based argument that Oxy\'s core capabilities were too location-specific to transfer effectively to Argentina?',
      hint: 'You are building the strongest possible version of this argument, regardless of your personal view. Use specific evidence from the case.',
      inputs: [
        { id: 'domestic_argument', kind: 'textarea', label: 'The strongest argument for location-specificity', placeholder: 'Build the argument using case evidence...' },
        { id: 'domestic_evidence', kind: 'textarea', label: 'The single most decisive piece of case evidence for this position', placeholder: 'One specific fact or event from the case...' }
      ]
    },
    {
      id: 9,
      section: 'Domestic vs. International',
      type: 'Argue',
      framework: 'Debate 1, Section 4-4',
      question: 'What is the strongest case-based argument that Oxy was forgoing significant value by retreating from international markets in 2010?',
      hint: 'You are building the strongest possible version of this argument, regardless of your personal view. Use specific evidence from the case.',
      inputs: [
        { id: 'international_argument', kind: 'textarea', label: 'The strongest argument for international opportunity foregone', placeholder: 'Build the argument using case evidence...' },
        { id: 'international_evidence', kind: 'textarea', label: 'The single most decisive piece of case evidence for this position', placeholder: 'One specific fact or event from the case...' }
      ]
    },
    {
      id: 10,
      section: 'Domestic vs. International',
      type: 'Connect',
      framework: 'Debate 1, Section 4-4',
      question: 'Having built both arguments in Tasks 8 and 9, which position does your group find more convincing, and what single piece of case evidence is most decisive?',
      hint: 'You have now seen the strongest version of both sides. A good answer acknowledges the strength of the opposing argument before explaining why your chosen position is more persuasive.',
      inputs: [
        { id: 'final_position', kind: 'choice', label: 'Your group\'s final position', options: ['Oxy\'s capabilities were too location-specific, the retreat was justified', 'Oxy forewent significant value, the retreat was a strategic error', 'The evidence is genuinely ambiguous, neither position is clearly stronger'] },
        { id: 'decisive_evidence', kind: 'textarea', label: 'What single piece of case evidence is most decisive, and why does it tip the balance?', placeholder: 'Name the specific evidence and explain its weight...' },
        { id: 'opposing_strength', kind: 'textarea', label: 'What is the strongest remaining objection to your position?', placeholder: 'Acknowledge what the other side gets right...' }
      ]
    }
  ]

}; // end WEEK_CONFIG
// ════════════════════════════════════════════════════════════════════════════
//  END OF CONFIG — do not edit below this line
// ════════════════════════════════════════════════════════════════════════════

// ── Derived constants ──────────────────────────────────────────────────────
const TASKS = WEEK_CONFIG.tasks;
const TASK_COUNT = TASKS.length;

// Unique section labels in insertion order
const SECTIONS = [...new Set(TASKS.map(t => t.section))];

// ── Populate static DOM from config ───────────────────────────────────────
document.title = `INTBUS 201 — Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-week-label').textContent  = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-title').textContent        = WEEK_CONFIG.title;
document.getElementById('wc-case-ref').textContent     = WEEK_CONFIG.caseRef;
document.getElementById('header-title').textContent    = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('header-sub').textContent      = WEEK_CONFIG.title;
document.getElementById('complete-msg').textContent    =
  `Your group has completed all ${TASK_COUNT} tasks. The facilitator will select responses for full-class discussion shortly.`;

// Completion summary grid: count each type
const typeCounts = {};
TASKS.forEach(t => typeCounts[t.type] = (typeCounts[t.type] || 0) + 1);
document.getElementById('summary-grid').innerHTML = Object.entries(typeCounts)
  .map(([type, n]) => `<div class="summary-stat"><div class="stat-num">${n}</div><div class="stat-label">${type}</div></div>`)
  .join('');

// Debrief hint: mention the last section's highest-id tasks
const lastSection = SECTIONS[SECTIONS.length - 1];
const lastTasks = TASKS.filter(t => t.section === lastSection);
const hintIds = lastTasks.slice(-3).map(t => `Task ${t.id}`).join(', ');
document.getElementById('debrief-hint').textContent =
  `Be ready to explain your reasoning, especially on ${hintIds}.`;

// ── State ──────────────────────────────────────────────────────────────────
let state = {
  group: '',
  currentTask: 0,
  answers: {},       // taskId -> { inputs: {}, submitted: false }
  completedCount: 0,
  reviewMode: false
};

// ── Welcome screen ─────────────────────────────────────────────────────────
const groupInput = document.getElementById('group-input');
const btnStart   = document.getElementById('btn-start');

groupInput.addEventListener('input', () => {
  btnStart.disabled = groupInput.value.trim().length === 0;
});
groupInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !btnStart.disabled) startWorkshop();
});
btnStart.addEventListener('click', startWorkshop);

function startWorkshop() {
  state.group = groupInput.value.trim();
  document.getElementById('header-group').textContent = state.group;
  showScreen('screen-task');
  buildSidebar();
  renderTask(0);
}

// ── Screens ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-complete') {
    setTimeout(() => {
      const btn = document.getElementById('btn-review');
      if (btn) btn.addEventListener('click', () => {
        state.reviewMode = true;
        showScreen('screen-task');
        renderTask(0);
      });
    }, 50);
  }
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  SECTIONS.forEach(section => {
    const tasks = TASKS.filter(t => t.section === section);
    const wrap  = document.createElement('div');
    wrap.className = 'sidebar-section';
    const label = document.createElement('div');
    label.className = 'sidebar-section-label';
    label.textContent = section;
    wrap.appendChild(label);
    tasks.forEach(task => {
      const item = document.createElement('div');
      item.className = 'task-nav-item';
      item.id = `nav-${task.id}`;
      item.innerHTML = `<div class="task-num">${task.id}</div><div class="task-nav-label">${task.type}</div>`;
      item.addEventListener('click', () => { saveCurrentAnswers(); renderTask(task.id - 1); });
      wrap.appendChild(item);
    });
    sidebar.appendChild(wrap);
  });
}

function updateSidebar() {
  TASKS.forEach((task, i) => {
    const item = document.getElementById(`nav-${task.id}`);
    if (!item) return;
    item.classList.remove('active', 'completed');
    if (i === state.currentTask) item.classList.add('active');
    if (state.answers[task.id]?.submitted) item.classList.add('completed');
  });
}

// ── Render task ────────────────────────────────────────────────────────────
function renderTask(index) {
  state.currentTask = index;
  const task   = TASKS[index];
  const main   = document.getElementById('task-main');
  const saved  = state.answers[task.id] || { inputs: {}, submitted: false };
  const isLocked = saved.submitted;

  const typeClass = { Classify: 'tag-classify', Argue: 'tag-argue', Connect: 'tag-connect' }[task.type] || 'tag-classify';

  const inputsHTML = task.inputs.map(inp => {
    if (inp.kind === 'choice') {
      const opts = inp.options.map(opt => {
        const sel = saved.inputs[inp.id] === opt ? 'selected' : '';
        const lockedAttr = isLocked ? 'style="pointer-events:none;opacity:0.75;"' : '';
        return `<div class="choice-option ${sel}" data-input="${inp.id}" data-value="${opt}" ${lockedAttr}>
          <div class="choice-radio"><div class="choice-radio-dot"></div></div>
          <div class="choice-text">${opt}</div>
        </div>`;
      }).join('');
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <div class="choice-group">${opts}</div>
      </div>`;
    } else {
      const val = saved.inputs[inp.id] || '';
      const disabledAttr = isLocked ? 'disabled' : '';
      const bgStyle = isLocked ? 'style="background:#F2F4F7;color:#6B7A90;cursor:not-allowed;"' : '';
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <textarea id="ta-${inp.id}" placeholder="${inp.placeholder}" rows="4" ${disabledAttr} ${bgStyle}>${val}</textarea>
        ${!isLocked ? `<div class="char-count" id="cc-${inp.id}">${val.length} characters</div>` : ''}
      </div>`;
    }
  }).join('');

  const prevDisabled = index === 0 ? 'disabled' : '';
  const nextLabel    = index === TASK_COUNT - 1 ? (state.reviewMode ? 'Back to summary' : 'Finish') : 'Next →';
  const lockedNotice = isLocked ? `<div class="locked-notice">
    <span>✓ Submitted</span>
    <button id="btn-unsubmit" style="font-size:12px;padding:4px 12px;border:1px solid #0A6E45;background:#fff;color:#0A6E45;border-radius:5px;cursor:pointer;font-weight:600;">Unsubmit to edit</button>
  </div>` : '';

  main.innerHTML = `
    <div class="task-header">
      <div class="task-meta">
        <span class="task-number-label">Task ${task.id} of ${TASK_COUNT}</span>
        <span class="task-type-tag ${typeClass}">${task.type}</span>
        <span class="task-framework">${task.framework}</span>
      </div>
      <div class="task-question">${task.question}</div>
      <div class="task-hint">${task.hint}</div>
    </div>
    ${lockedNotice}
    <div class="${isLocked ? 'locked' : ''}">${inputsHTML}</div>
    <div class="task-footer">
      <button class="btn-secondary" id="btn-prev" ${prevDisabled}>← Previous</button>
      <div style="display:flex;gap:12px;align-items:center;">
        ${!isLocked ? `<button class="btn-submit" id="btn-submit-task">Submit this task</button>` : ''}
        <button class="btn-secondary" id="btn-next">${nextLabel}</button>
      </div>
    </div>
  `;

  // Textarea char counts
  task.inputs.filter(i => i.kind === 'textarea').forEach(inp => {
    const ta = document.getElementById(`ta-${inp.id}`);
    const cc = document.getElementById(`cc-${inp.id}`);
    if (ta && cc) ta.addEventListener('input', () => { cc.textContent = ta.value.length + ' characters'; });
  });

  // Unsubmit
  const unsubmitBtn = document.getElementById('btn-unsubmit');
  if (unsubmitBtn) {
    unsubmitBtn.addEventListener('click', () => {
      state.answers[task.id].submitted = false;
      state.reviewMode = false;
      state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
      updateProgress();
      syncToFirebase(task.id);
      renderTask(index);
    });
  }

  // Choice selection
  if (!isLocked) {
    main.querySelectorAll('.choice-option').forEach(el => {
      el.addEventListener('click', () => {
        const inputId = el.dataset.input;
        main.querySelectorAll(`.choice-option[data-input="${inputId}"]`).forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  }

  // Submit
  const submitBtn = document.getElementById('btn-submit-task');
  if (submitBtn) submitBtn.addEventListener('click', () => { if (!isLocked) submitTask(task.id); });

  // Prev / Next
  const btnPrev = document.getElementById('btn-prev');
  if (btnPrev) btnPrev.addEventListener('click', () => { if (!isLocked) saveCurrentAnswers(); if (index > 0) renderTask(index - 1); });

  document.getElementById('btn-next').addEventListener('click', () => {
    if (!isLocked) saveCurrentAnswers();
    if (index < TASK_COUNT - 1) { renderTask(index + 1); }
    else { state.reviewMode = false; showScreen('screen-complete'); }
  });

  updateSidebar();
  updateProgress();
  main.scrollTop = 0;
}

// ── Save / submit ──────────────────────────────────────────────────────────
function saveCurrentAnswers() {
  const task = TASKS[state.currentTask];
  const inputs = {};
  task.inputs.forEach(inp => {
    if (inp.kind === 'textarea') {
      const ta = document.getElementById(`ta-${inp.id}`);
      if (ta) inputs[inp.id] = ta.value;
    } else {
      const sel = document.querySelector(`.choice-option.selected[data-input="${inp.id}"]`);
      if (sel) inputs[inp.id] = sel.dataset.value;
    }
  });
  if (!state.answers[task.id]) state.answers[task.id] = { inputs: {}, submitted: false };
  state.answers[task.id].inputs = inputs;
}

function submitTask(taskId) {
  saveCurrentAnswers();
  if (!state.answers[taskId]) state.answers[taskId] = { inputs: {}, submitted: false };
  state.answers[taskId].submitted = true;
  state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
  updateSidebar();
  updateProgress();
  syncToFirebase(taskId);
  renderTask(state.currentTask);
}

// ── Firebase sync ──────────────────────────────────────────────────────────
function syncToFirebase(taskId) {
  if (!window._db || !state.group) return;
  const groupKey = state.group.replace(/[^a-zA-Z0-9]/g, '_');
  const task = TASKS[taskId - 1];
  const ans  = state.answers[taskId];
  if (!ans) return;
  const payload = {
    group:          state.group,
    taskId:         taskId,
    taskType:       task.type,
    taskSection:    task.section,
    submitted:      ans.submitted,
    inputs:         ans.inputs,
    completedCount: state.completedCount,
    timestamp:      Date.now()
  };
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/tasks/${taskId}`), payload);
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/summary`), {
    group:          state.group,
    completedCount: state.completedCount,
    lastUpdate:     Date.now()
  });
}

function updateProgress() {
  const pct = (state.completedCount / TASK_COUNT) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}
</script>
