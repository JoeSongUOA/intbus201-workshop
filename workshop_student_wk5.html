<script>
// ════════════════════════════════════════════════════════════════════════════
//  WEEK CONFIG — EDIT THIS SECTION ONLY
//  Copy this file, change the values below, and deploy.
// ════════════════════════════════════════════════════════════════════════════
const WEEK_CONFIG = {
 
  week:         5,
  title:        'Made in China',
  caseRef:      'Integrative Case 2.2 · Peng (2023), pp. 282–283',
  firebasePath: 'sessions/week5',
 
  tasks: [
    {
      id: 1,
      section: 'Why Nations Trade',
      type: 'Classify',
      framework: 'Resource-Based View vs. Institution-Based View',
      question: 'Sara found that all four remaining US lamp makers used Chinese components. Which view better explains why a fully domestic lamp no longer exists?',
      hint: 'Consider whether the explanation lies in what firms can produce efficiently, or in the trade rules that shaped the industry over time.',
      inputs: [
        { id: 'lamp_view', kind: 'choice', label: 'Which view explains this best?', options: ['Resource-based view: US firms lack productive capability without Chinese components', 'Institution-based view: decades of trade rules made domestic lamp production unviable'] },
        { id: 'lamp_reasoning', kind: 'textarea', label: 'Which view does more explanatory work, and why?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 2,
      section: 'Theories of International Trade',
      type: 'Classify',
      framework: 'Comparative Advantage / Factor Endowment Theory',
      question: 'Sara paid $68 for Italian shoes to replace $9 Chinese ones. What does this price gap tell you about China\'s position in shoe production?',
      hint: 'Think about which factor endowments — labour, capital, technology — make production cheaper in one country.',
      inputs: [
        { id: 'shoe_advantage', kind: 'choice', label: 'What best explains China\'s cost position?', options: ['Absolute advantage: China produces shoes more efficiently overall', 'Comparative advantage: China has a relative cost advantage in shoe production', 'Trade barrier effect: the gap reflects policy, not production efficiency'] },
        { id: 'shoe_reasoning', kind: 'textarea', label: 'Which factor endowments explain China\'s cost advantage here?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 3,
      section: 'Theories of International Trade',
      type: 'Classify',
      framework: 'Tariff Barriers vs. Non-Tariff Barriers',
      question: 'Sara\'s rule — buying nothing labelled "Made in China" — functioned like a trade barrier. Which type does it most closely resemble?',
      hint: 'Consider whether her rule worked through price, or through blocking access regardless of price.',
      inputs: [
        { id: 'barrier_type', kind: 'choice', label: 'Which barrier type fits Sara\'s rule?', options: ['Tariff barrier: raised the effective cost of Chinese goods', 'Non-tariff barrier: blocked access regardless of price', 'Voluntary import restraint: self-imposed, not externally enforced'] },
        { id: 'barrier_reasoning', kind: 'textarea', label: 'Justify your choice and note one limitation of this analogy.', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 4,
      section: 'Theories of International Trade',
      type: 'Connect',
      framework: 'Comparative Advantage → Trade Barrier Costs',
      question: 'Connect your Task 2 and Task 3 conclusions. What do they together reveal about the cost of restricting access to goods from a lower-cost producer?',
      hint: 'Comparative advantage theory predicts specific welfare effects when trade is restricted. Map that prediction onto Sara\'s actual costs.',
      inputs: [
        { id: 'connect_2_3', kind: 'textarea', label: 'What does the connection between your Task 2 and Task 3 conclusions reveal?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 5,
      section: 'Realities of International Trade',
      type: 'Classify',
      framework: 'Economic Arguments Against Free Trade',
      question: 'Sara\'s experiment resembled a personal protectionist argument: buy domestic, support local production, reduce foreign dependence. Which economic argument against free trade does her motivation most closely reflect?',
      hint: 'Review the economic arguments against free trade from this week. Think about what each argument requires to be true, and which conditions the case does or does not support.',
      inputs: [
        { id: 'protection_argument', kind: 'choice', label: 'Which argument fits Sara\'s motivation?', options: ['Protect domestic industries: support US producers even at higher cost', 'Infant industry: US producers could compete if given enough consumer support', 'Neither: Sara\'s motivation was personal, not an economic argument'] },
        { id: 'protection_reasoning', kind: 'textarea', label: 'Does the case evidence support the argument Sara implicitly made?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 6,
      section: 'Realities of International Trade',
      type: 'Classify',
      framework: 'Deadweight Cost',
      question: 'Sara incurred several different types of additional cost during the experiment. How should they be classified using the concept of deadweight cost?',
      hint: 'Deadweight cost refers to net losses from trade restriction that are not offset by gains to any other party.',
      inputs: [
        { id: 'deadweight_verdict', kind: 'choice', label: 'How should Sara\'s additional costs be classified?', options: ['Deadweight costs: welfare lost with no offsetting gain to any party', 'Transfer costs: extra spending became revenue for non-Chinese producers', 'Both apply: some are deadweight losses, some are transfers'] },
        { id: 'deadweight_reasoning', kind: 'textarea', label: 'Which specific costs are deadweight losses, and which are transfers?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 7,
      section: 'Realities of International Trade',
      type: 'Connect',
      framework: 'Deadweight Cost → Political Logic of Trade Barriers',
      question: 'Connect your Task 6 conclusion to the political logic of trade barriers. If deadweight costs fall on dispersed consumers and gains go to concentrated producers, what does Sara\'s experiment reveal about why trade barriers persist?',
      hint: 'Think about who organises political pressure for protection, and who bears the costs silently.',
      inputs: [
        { id: 'connect_6_7', kind: 'textarea', label: 'Who in Sara\'s case corresponds to the concentrated producer, and who to the dispersed consumer?', placeholder: 'Your reasoning...' }
      ]
    },
    {
      id: 8,
      section: 'Debates: Gains vs. Pains from Trade',
      type: 'Argue',
      framework: 'Gains and Pains from Trade',
      question: 'Sara\'s family paid significantly more for non-Chinese alternatives throughout the year. Do these costs better illustrate the gains from open trade with China, or the pains from restricting it?',
      hint: 'Both positions draw on the same evidence. The difference lies in the interpretive frame: one emphasises what open trade provides, the other what restriction imposes.',
      inputs: [
        { id: 'gains_pains_position', kind: 'choice', label: 'Which position does the evidence better support?', options: ['Gains from open trade: costs reveal consumer surplus that trade normally generates', 'Pains from restriction: costs show direct welfare loss when access is removed'] },
        { id: 'gains_pains_argument', kind: 'textarea', label: 'Defend your position using at least two specific examples from the case.', placeholder: 'Your argument...' },
        { id: 'gains_pains_evidence', kind: 'textarea', label: 'The single most decisive piece of evidence for your position.', placeholder: 'One specific fact...' }
      ]
    },
    {
      id: 9,
      section: 'Debates: Gains vs. Pains from Trade',
      type: 'Argue',
      framework: 'Trade Barriers and Comparative Advantage',
      question: 'Coffeemakers, printer cartridges, and Halloween decorations were almost exclusively made in China with few affordable alternatives. Would you support or oppose government tariffs on such goods?',
      hint: 'Use at least one framework from this week: deadweight cost, comparative advantage, infant industry argument, or strategic trade theory.',
      inputs: [
        { id: 'tariff_position', kind: 'choice', label: 'Should governments impose tariffs on these goods?', options: ['Support: reduce dependence on a single supplier and encourage domestic production', 'Oppose: tariffs impose consumer costs without changing the underlying comparative advantage'] },
        { id: 'tariff_argument', kind: 'textarea', label: 'Defend your position using this week\'s frameworks.', placeholder: 'Your argument...' },
        { id: 'tariff_evidence', kind: 'textarea', label: 'The single most decisive piece of evidence for your position.', placeholder: 'One specific fact...' }
      ]
    },
    {
      id: 10,
      section: 'Debates: Gains vs. Pains from Trade',
      type: 'Connect',
      framework: 'Comparative Advantage + Trade Barriers + Gains and Pains from Trade',
      question: 'Connect your Task 8 and Task 9 conclusions. What is your group\'s final position on whether governments should restrict imports of everyday goods predominantly sourced from one country?',
      hint: 'Draw on both the consumer cost evidence from the case and the framework logic on gains and losses from trade policy.',
      inputs: [
        { id: 'final_position', kind: 'choice', label: 'Your group\'s final position', options: ['Impose tariffs: strategic arguments outweigh the consumer cost evidence', 'Do not impose tariffs: consumer cost evidence and comparative advantage outweigh protection arguments', 'Use non-tariff measures: subsidies impose lower deadweight costs than tariffs'] },
        { id: 'decisive_evidence', kind: 'textarea', label: 'What single piece of evidence is most decisive, and why?', placeholder: 'Name the evidence and explain its weight...' },
        { id: 'opposing_strength', kind: 'textarea', label: 'What is the strongest objection to your position?', placeholder: 'Acknowledge what the other side gets right...' }
      ]
    }
  ]
 
}; // end WEEK_CONFIG
// ════════════════════════════════════════════════════════════════════════════
//  END OF CONFIG — do not edit below this line
// ════════════════════════════════════════════════════════════════════════════

// ── Derived constants ──────────────────────────────────────────────────────
const TASKS = WEEK_CONFIG.tasks;
const TASK_COUNT = TASKS.length;

// Unique section labels in insertion order
const SECTIONS = [...new Set(TASKS.map(t => t.section))];

// ── Populate static DOM from config ───────────────────────────────────────
document.title = `INTBUS 201 — Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-week-label').textContent  = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('wc-title').textContent        = WEEK_CONFIG.title;
document.getElementById('wc-case-ref').textContent     = WEEK_CONFIG.caseRef;
document.getElementById('header-title').textContent    = `INTBUS 201 · Week ${WEEK_CONFIG.week} Workshop`;
document.getElementById('header-sub').textContent      = WEEK_CONFIG.title;
document.getElementById('complete-msg').textContent    =
  `Your group has completed all ${TASK_COUNT} tasks. The facilitator will select responses for full-class discussion shortly.`;

// Completion summary grid: count each type
const typeCounts = {};
TASKS.forEach(t => typeCounts[t.type] = (typeCounts[t.type] || 0) + 1);
document.getElementById('summary-grid').innerHTML = Object.entries(typeCounts)
  .map(([type, n]) => `<div class="summary-stat"><div class="stat-num">${n}</div><div class="stat-label">${type}</div></div>`)
  .join('');

// Debrief hint: mention the last section's highest-id tasks
const lastSection = SECTIONS[SECTIONS.length - 1];
const lastTasks = TASKS.filter(t => t.section === lastSection);
const hintIds = lastTasks.slice(-3).map(t => `Task ${t.id}`).join(', ');
document.getElementById('debrief-hint').textContent =
  `Be ready to explain your reasoning, especially on ${hintIds}.`;

// ── State ──────────────────────────────────────────────────────────────────
let state = {
  group: '',
  currentTask: 0,
  answers: {},       // taskId -> { inputs: {}, submitted: false }
  completedCount: 0,
  reviewMode: false
};

// ── Welcome screen ─────────────────────────────────────────────────────────
const groupInput = document.getElementById('group-input');
const btnStart   = document.getElementById('btn-start');

groupInput.addEventListener('input', () => {
  btnStart.disabled = groupInput.value.trim().length === 0;
});
groupInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !btnStart.disabled) startWorkshop();
});
btnStart.addEventListener('click', startWorkshop);

function startWorkshop() {
  state.group = groupInput.value.trim();
  document.getElementById('header-group').textContent = state.group;
  showScreen('screen-task');
  buildSidebar();
  renderTask(0);
}

// ── Screens ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-complete') {
    setTimeout(() => {
      const btn = document.getElementById('btn-review');
      if (btn) btn.addEventListener('click', () => {
        state.reviewMode = true;
        showScreen('screen-task');
        renderTask(0);
      });
    }, 50);
  }
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  SECTIONS.forEach(section => {
    const tasks = TASKS.filter(t => t.section === section);
    const wrap  = document.createElement('div');
    wrap.className = 'sidebar-section';
    const label = document.createElement('div');
    label.className = 'sidebar-section-label';
    label.textContent = section;
    wrap.appendChild(label);
    tasks.forEach(task => {
      const item = document.createElement('div');
      item.className = 'task-nav-item';
      item.id = `nav-${task.id}`;
      item.innerHTML = `<div class="task-num">${task.id}</div><div class="task-nav-label">${task.type}</div>`;
      item.addEventListener('click', () => { saveCurrentAnswers(); renderTask(task.id - 1); });
      wrap.appendChild(item);
    });
    sidebar.appendChild(wrap);
  });
}

function updateSidebar() {
  TASKS.forEach((task, i) => {
    const item = document.getElementById(`nav-${task.id}`);
    if (!item) return;
    item.classList.remove('active', 'completed');
    if (i === state.currentTask) item.classList.add('active');
    if (state.answers[task.id]?.submitted) item.classList.add('completed');
  });
}

// ── Render task ────────────────────────────────────────────────────────────
function renderTask(index) {
  state.currentTask = index;
  const task   = TASKS[index];
  const main   = document.getElementById('task-main');
  const saved  = state.answers[task.id] || { inputs: {}, submitted: false };
  const isLocked = saved.submitted;

  const typeClass = { Classify: 'tag-classify', Argue: 'tag-argue', Connect: 'tag-connect' }[task.type] || 'tag-classify';

  const inputsHTML = task.inputs.map(inp => {
    if (inp.kind === 'choice') {
      const opts = inp.options.map(opt => {
        const sel = saved.inputs[inp.id] === opt ? 'selected' : '';
        const lockedAttr = isLocked ? 'style="pointer-events:none;opacity:0.75;"' : '';
        const colonIdx = opt.indexOf(':');
        const optMain = colonIdx > -1 ? opt.substring(0, colonIdx).trim() : opt;
        const optSub  = colonIdx > -1 ? opt.substring(colonIdx + 1).trim() : '';
        const optHTML = optSub
          ? `<div class="choice-text-main">${optMain}</div><div class="choice-text-sub">${optSub}</div>`
          : `<div class="choice-text">${optMain}</div>`;
        return `<div class="choice-option ${sel}" data-input="${inp.id}" data-value="${opt}" ${lockedAttr}>
          <div class="choice-radio"><div class="choice-radio-dot"></div></div>
          <div>${optHTML}</div>
        </div>`;
      }).join('');
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <div class="choice-group">${opts}</div>
      </div>`;
    } else {
      const val = saved.inputs[inp.id] || '';
      const disabledAttr = isLocked ? 'disabled' : '';
      const bgStyle = isLocked ? 'style="background:#F2F4F7;color:#6B7A90;cursor:not-allowed;"' : '';
      return `<div class="input-group">
        <span class="input-label">${inp.label}</span>
        <textarea id="ta-${inp.id}" placeholder="${inp.placeholder}" rows="4" ${disabledAttr} ${bgStyle}>${val}</textarea>
        ${!isLocked ? `<div class="char-count" id="cc-${inp.id}">${val.length} characters</div>` : ''}
      </div>`;
    }
  }).join('');

  const prevDisabled = index === 0 ? 'disabled' : '';
  const nextLabel    = index === TASK_COUNT - 1 ? (state.reviewMode ? 'Back to summary' : 'Finish') : 'Next →';
  const lockedNotice = isLocked ? `<div class="locked-notice">
    <span>✓ Submitted</span>
    <button id="btn-unsubmit" style="font-size:12px;padding:4px 12px;border:1px solid #0A6E45;background:#fff;color:#0A6E45;border-radius:5px;cursor:pointer;font-weight:600;">Unsubmit to edit</button>
  </div>` : '';

  main.innerHTML = `
    <div class="task-header">
      <div class="task-meta">
        <span class="task-number-label">Task ${task.id} of ${TASK_COUNT}</span>
        <span class="task-type-tag ${typeClass}">${task.type}</span>
        <span class="task-framework">${task.framework}</span>
      </div>
      <div class="task-question">${task.question}</div>
      <div class="task-hint">${task.hint}</div>
    </div>
    ${lockedNotice}
    <div class="${isLocked ? 'locked' : ''}">${inputsHTML}</div>
    <div class="task-footer">
      <button class="btn-secondary" id="btn-prev" ${prevDisabled}>← Previous</button>
      <div style="display:flex;gap:12px;align-items:center;">
        ${!isLocked ? `<button class="btn-submit" id="btn-submit-task">Submit this task</button>` : ''}
        <button class="btn-secondary" id="btn-next">${nextLabel}</button>
      </div>
    </div>
  `;

  // Textarea char counts
  task.inputs.filter(i => i.kind === 'textarea').forEach(inp => {
    const ta = document.getElementById(`ta-${inp.id}`);
    const cc = document.getElementById(`cc-${inp.id}`);
    if (ta && cc) ta.addEventListener('input', () => { cc.textContent = ta.value.length + ' characters'; });
  });

  // Unsubmit
  const unsubmitBtn = document.getElementById('btn-unsubmit');
  if (unsubmitBtn) {
    unsubmitBtn.addEventListener('click', () => {
      state.answers[task.id].submitted = false;
      state.reviewMode = false;
      state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
      updateProgress();
      syncToFirebase(task.id);
      renderTask(index);
    });
  }

  // Choice selection
  if (!isLocked) {
    main.querySelectorAll('.choice-option').forEach(el => {
      el.addEventListener('click', () => {
        const inputId = el.dataset.input;
        main.querySelectorAll(`.choice-option[data-input="${inputId}"]`).forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
      });
    });
  }

  // Submit
  const submitBtn = document.getElementById('btn-submit-task');
  if (submitBtn) submitBtn.addEventListener('click', () => { if (!isLocked) submitTask(task.id); });

  // Prev / Next
  const btnPrev = document.getElementById('btn-prev');
  if (btnPrev) btnPrev.addEventListener('click', () => { if (!isLocked) saveCurrentAnswers(); if (index > 0) renderTask(index - 1); });

  document.getElementById('btn-next').addEventListener('click', () => {
    if (!isLocked) saveCurrentAnswers();
    if (index < TASK_COUNT - 1) { renderTask(index + 1); }
    else { state.reviewMode = false; showScreen('screen-complete'); }
  });

  updateSidebar();
  updateProgress();
  main.scrollTop = 0;
}

// ── Save / submit ──────────────────────────────────────────────────────────
function saveCurrentAnswers() {
  const task = TASKS[state.currentTask];
  const inputs = {};
  task.inputs.forEach(inp => {
    if (inp.kind === 'textarea') {
      const ta = document.getElementById(`ta-${inp.id}`);
      if (ta) inputs[inp.id] = ta.value;
    } else {
      const sel = document.querySelector(`.choice-option.selected[data-input="${inp.id}"]`);
      if (sel) inputs[inp.id] = sel.dataset.value;
    }
  });
  if (!state.answers[task.id]) state.answers[task.id] = { inputs: {}, submitted: false };
  state.answers[task.id].inputs = inputs;
}

function submitTask(taskId) {
  saveCurrentAnswers();
  if (!state.answers[taskId]) state.answers[taskId] = { inputs: {}, submitted: false };
  state.answers[taskId].submitted = true;
  state.completedCount = Object.values(state.answers).filter(a => a.submitted).length;
  updateSidebar();
  updateProgress();
  syncToFirebase(taskId);
  renderTask(state.currentTask);
}

// ── Firebase sync ──────────────────────────────────────────────────────────
function syncToFirebase(taskId) {
  if (!window._db || !state.group) return;
  const groupKey = state.group.replace(/[^a-zA-Z0-9]/g, '_');
  const task = TASKS[taskId - 1];
  const ans  = state.answers[taskId];
  if (!ans) return;
  const payload = {
    group:          state.group,
    taskId:         taskId,
    taskType:       task.type,
    taskSection:    task.section,
    submitted:      ans.submitted,
    inputs:         ans.inputs,
    completedCount: state.completedCount,
    timestamp:      Date.now()
  };
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/tasks/${taskId}`), payload);
  window._set(window._ref(window._db, `${WEEK_CONFIG.firebasePath}/${groupKey}/summary`), {
    group:          state.group,
    completedCount: state.completedCount,
    lastUpdate:     Date.now()
  });
}

function updateProgress() {
  const pct = (state.completedCount / TASK_COUNT) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}
</script>
</body>
</html>
