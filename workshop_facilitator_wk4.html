// ── Derived constants ──────────────────────────────────────────────────────
const TASKS      = WEEK_CONFIG.tasks;
const TASK_COUNT = TASKS.length;

// Build a fast lookup: taskId -> type string (lower-case, for CSS class)
const TASK_TYPES = {};
TASKS.forEach(t => { TASK_TYPES[t.id] = t.type.toLowerCase(); });

const STANCE_COLORS = ['fill-0','fill-1','fill-2','fill-3'];
const CLOUD_ACCENT_COLORS = ['#5BA8E0','#C89010','#9B6AFF','#4ADE80'];

// ── Populate static DOM from config ───────────────────────────────────────
document.title = `INTBUS 201 — Week ${WEEK_CONFIG.week} Facilitator View`;
document.getElementById('header-title').textContent =
  `INTBUS 201 · Week ${WEEK_CONFIG.week} · ${WEEK_CONFIG.title} · Facilitator View`;

// Build detail-select options
const detailSelect = document.getElementById('detail-select');
TASKS.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t.id;
  opt.textContent = `Task ${t.id} — ${t.framework} (${t.type})`;
  detailSelect.appendChild(opt);
});

// Build stance blocks in middle column
const colStance = document.getElementById('col-stance');
const stanceTaskIds = Object.keys(WEEK_CONFIG.stanceConfig).map(Number).sort((a,b)=>a-b);
stanceTaskIds.forEach((taskId, idx) => {
  const cfg = WEEK_CONFIG.stanceConfig[taskId];
  const task = TASKS.find(t => t.id === taskId);
  const question = task?.inputs.find(i => i.id === cfg.field)?.label || cfg.label;
  if (idx > 0) {
    const hr = document.createElement('hr');
    hr.className = 'divider';
    colStance.appendChild(hr);
  }
  const block = document.createElement('div');
  block.className = 'stance-block';
  block.innerHTML = `
    <div class="stance-block-title">${cfg.label}</div>
    <div class="stance-q">${question}</div>
    <div id="stance-${taskId}"></div>
  `;
  colStance.appendChild(block);
});

// Build keyword cloud sections in right column
const colClouds = document.getElementById('col-clouds');
const hr0 = colClouds.querySelector('.divider');

WEEK_CONFIG.keywordTasks.forEach((taskId, idx) => {
  const task = TASKS.find(t => t.id === taskId);
  const color = CLOUD_ACCENT_COLORS[idx] || '#5BA8E0';
  const section = document.createElement('div');
  section.className = 'cloud-section';
  section.innerHTML = `
    <div class="cloud-label" style="color:${color}">Task ${taskId} — ${task?.framework || ''} (${task?.type || ''})</div>
    <div class="tfidf-cloud" id="cloud-${taskId}"><span class="cloud-empty">Waiting for submissions...</span></div>
  `;
  colClouds.insertBefore(section, hr0);
  if (idx < WEEK_CONFIG.keywordTasks.length - 1) {
    const hr = document.createElement('hr');
    hr.className = 'divider';
    colClouds.insertBefore(hr, hr0);
  }
});

if (WEEK_CONFIG.finalTask) {
  const hrPre = document.createElement('hr');
  hrPre.className = 'divider';
  colClouds.insertBefore(hrPre, hr0);
  const finalSection = document.createElement('div');
  finalSection.className = 'cloud-section';
  const task = TASKS.find(t => t.id === WEEK_CONFIG.finalTask);
  finalSection.innerHTML = `
    <div class="cloud-label" style="color:#9B6AFF">Task ${WEEK_CONFIG.finalTask} — Decisive evidence by position</div>
    <div style="display:flex;flex-direction:column;gap:8px;" id="cloud-final-wrap">
      ${WEEK_CONFIG.finalTaskPositions.map((pos, i) => {
        const shortPos = WEEK_CONFIG.finalTaskShortPositions?.[i] || (pos.indexOf(':') > -1 ? pos.substring(0, pos.indexOf(':')).trim() : pos);
        return `<div>
          <div class="cloud-sublabel" style="color:${CLOUD_ACCENT_COLORS[i] || '#fff'}">Position ${String.fromCharCode(65+i)} — ${shortPos}</div>
          <div class="tfidf-cloud" id="cloud-final-${i}"><span class="cloud-empty">No submissions yet</span></div>
        </div>`;
      }).join('')}
    </div>
  `;
  colClouds.insertBefore(finalSection, hr0);
}

// ── Page switch ────────────────────────────────────────────────────────────
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.getElementById(`btn-${page}`).classList.add('active');
}
window.switchPage = switchPage;

// ── Render all ─────────────────────────────────────────────────────────────
function renderAll(data) {
  const groups = Object.keys(data).sort();
  let totalSubmitted = 0;
  groups.forEach(gk => {
    Object.values(data[gk]?.tasks || {}).forEach(t => { if (t.submitted) totalSubmitted++; });
  });
  const maxPossible = groups.length * TASK_COUNT;
  const pct = maxPossible > 0 ? Math.round((totalSubmitted / maxPossible) * 100) : 0;

  ['stat-groups','pw-groups'].forEach(id => document.getElementById(id).textContent = groups.length);
  ['stat-submitted','pw-submitted'].forEach(id => document.getElementById(id).textContent = totalSubmitted);
  ['stat-pct','pw-pct'].forEach(id => document.getElementById(id).textContent = pct + '%');

  renderWall(data, groups);
  renderMiniWall(data, groups);
  renderStances(data, groups);
  renderClouds(data, groups);

  const sel = document.getElementById('detail-select');
  if (sel.value) renderDetail(data, parseInt(sel.value));
}

// ── Progress wall ──────────────────────────────────────────────────────────
function renderWall(data, groups) {
  const grid = document.getElementById('wall-grid');
  if (groups.length === 0) {
    grid.innerHTML = '<p style="font-size:13px;color:var(--muted);margin-top:20px;">Waiting for groups to connect...</p>';
    return;
  }
  grid.innerHTML = '';
  groups.forEach(gk => {
    const gData = data[gk];
    const tasks = gData.tasks || {};
    const submitted = Object.values(tasks).filter(t => t.submitted).length;
    const pct = Math.round((submitted / TASK_COUNT) * 100);
    const row = document.createElement('div');
    row.className = 'group-row';
    row.innerHTML = `
      <div class="group-name-wall">${gData.summary?.group || gk}</div>
      <div class="task-dots">
        ${Array.from({length: TASK_COUNT}, (_,i) => {
          const tid = i + 1;
          const t = tasks[tid];
          const done = t?.submitted;
          const type = TASK_TYPES[tid] || 'classify';
          return `<div class="task-dot ${done ? 'submitted ' + type : 'pending'}" title="Task ${tid} (${t?.taskType || type})">${tid}</div>`;
        }).join('')}
      </div>
      <div class="group-progress-bar"><div class="group-progress-fill" style="width:${pct}%"></div></div>
      <div class="group-pct">${pct}%</div>
    `;
    grid.appendChild(row);
  });
}

// ── Mini wall ──────────────────────────────────────────────────────────────
function renderMiniWall(data, groups) {
  const wall = document.getElementById('mini-wall');
  wall.innerHTML = groups.map(gk => {
    const tasks = data[gk]?.tasks || {};
    const dots = Array.from({length: TASK_COUNT}, (_,i) => {
      const done = tasks[i+1]?.submitted;
      return `<div class="mini-dot ${done ? 'done' : ''}"></div>`;
    }).join('');
    return `<div class="mini-group-row">
      <div class="mini-group-name" title="${data[gk]?.summary?.group || gk}">${data[gk]?.summary?.group || gk}</div>
      <div class="mini-dots">${dots}</div>
    </div>`;
  }).join('') || '<p style="font-size:11px;color:var(--muted);">No groups yet.</p>';
}

// ── Stance distribution ────────────────────────────────────────────────────
function renderStances(data, groups) {
  stanceTaskIds.forEach(taskId => {
    const cfg = WEEK_CONFIG.stanceConfig[taskId];
    const counts = {};
    cfg.options.forEach(o => counts[o] = 0);
    let total = 0;
    groups.forEach(gk => {
      const t = data[gk]?.tasks?.[taskId];
      if (!t?.submitted || !t.inputs?.[cfg.field]) return;
      const val = (t.inputs[cfg.field] || '').trim();
      let matched = cfg.options.find(o => o === val);
      if (!matched) {
        const valKey = val.toLowerCase().replace(/[^a-z]/g,'').substring(0,15);
        matched = cfg.options.find(o =>
          o.toLowerCase().replace(/[^a-z]/g,'').includes(valKey) ||
          valKey.includes(o.toLowerCase().replace(/[^a-z]/g,'').substring(0,15))
        );
      }
      if (matched) { counts[matched]++; total++; }
    });
    const el = document.getElementById(`stance-${taskId}`);
    if (!el) return;
    el.innerHTML = cfg.options.map((opt, i) => {
      const n   = counts[opt] || 0;
      const pct = total > 0 ? Math.round((n / total) * 100) : 0;
      let shortLabel;
      if (cfg.shortLabels && cfg.shortLabels[i]) {
        shortLabel = cfg.shortLabels[i];
      } else {
        const colonIdx = opt.indexOf(':');
        shortLabel = colonIdx > -1 ? opt.substring(0, colonIdx).trim() : (opt.length > 36 ? opt.substring(0, 34) + '...' : opt);
      }
      return `<div class="bar-row">
        <div class="bar-label" title="${opt}">${shortLabel}</div>
        <div class="bar-track">
          <div class="bar-fill ${STANCE_COLORS[i]}" style="width:${Math.max(pct,0)}%">${n > 0 ? n : ''}</div>
        </div>
      </div>`;
    }).join('');
  });
}

// ── TF-IDF engine ──────────────────────────────────────────────────────────
const STOPWORDS = new Set([
  'the','a','an','and','or','but','in','on','at','to','for','of','with','is','are',
  'was','were','be','been','it','its','this','that','these','those','by','from','as',
  'not','no','so','if','do','did','does','has','have','had','can','could','would',
  'should','will','may','might','they','their','them','we','our','you','your','i',
  'my','he','she','his','her','which','who','what','how','when','where','why','both',
  'also','more','most','very','just','than','then','there','into','over','after',
  'before','about','up','out','all','its','been','however','because','since','while',
  'through','between','during','without','within','against','toward','suggests','suggest',
  'shows','show','argue','argues','argument','evidence','position','ability','based',
  'case','capability','capabilities'
]);

function tokenize(text) {
  if (!text) return [];
  return text.toLowerCase()
    .replace(/[^a-z\s]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 3 && !STOPWORDS.has(w));
}

function computeTFIDF(corpusDocs) {
  if (!corpusDocs.length) return {};
  const N = corpusDocs.length;
  const tokenizedDocs = corpusDocs.map(tokenize);
  const tfDocs = tokenizedDocs.map(tokens => {
    const freq = {};
    tokens.forEach(t => freq[t] = (freq[t] || 0) + 1);
    const maxFreq = Math.max(...Object.values(freq), 1);
    Object.keys(freq).forEach(t => freq[t] = freq[t] / maxFreq);
    return freq;
  });
  const df = {};
  tokenizedDocs.forEach(tokens => { new Set(tokens).forEach(t => df[t] = (df[t] || 0) + 1); });
  const scores = {};
  tfDocs.forEach(tf => {
    Object.entries(tf).forEach(([t, tfScore]) => {
      const idf = Math.log((N + 1) / ((df[t] || 0) + 1)) + 1;
      scores[t] = (scores[t] || 0) + tfScore * idf;
    });
  });
  return scores;
}

function renderCloud(elId, docs, accentColor) {
  const el = document.getElementById(elId);
  if (!el) return;
  const validDocs = docs.filter(Boolean);
  if (!validDocs.length) {
    el.innerHTML = '<span class="cloud-empty">No submissions yet.</span>';
    return;
  }
  const scores = computeTFIDF(validDocs);
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,20);
  if (!sorted.length) { el.innerHTML = '<span class="cloud-empty">Not enough text.</span>'; return; }
  const maxScore = sorted[0][1];
  const minScore = sorted[sorted.length-1][1];
  const range = maxScore - minScore || 1;
  el.innerHTML = sorted.map(([word, score]) => {
    const t    = (score - minScore) / range;
    const size = Math.round(10 + t * 14);
    const opacity = 0.4 + t * 0.6;
    return `<span class="cloud-word" style="font-size:${size}px;color:${accentColor};opacity:${opacity}" title="${word}: ${score.toFixed(2)}">${word}</span>`;
  }).join('');
}

// ── Keyword clouds ─────────────────────────────────────────────────────────
function renderClouds(data, groups) {
  // Per-task keyword clouds: use the first textarea field of each task
  WEEK_CONFIG.keywordTasks.forEach((taskId, idx) => {
    const task = TASKS.find(t => t.id === taskId);
    const firstTextareaField = task?.inputs.find(i => i.kind === 'textarea')?.id;
    if (!firstTextareaField) return;
    const docs = groups.map(gk => {
      const t = data[gk]?.tasks?.[taskId];
      return t?.submitted ? t.inputs?.[firstTextareaField] : null;
    }).filter(Boolean);
    renderCloud(`cloud-${taskId}`, docs, CLOUD_ACCENT_COLORS[idx] || '#5BA8E0');
  });

  // Final task: split by stance
  if (WEEK_CONFIG.finalTask) {
    const stanceDocs = WEEK_CONFIG.finalTaskPositions.map(() => []);
    groups.forEach(gk => {
      const t = data[gk]?.tasks?.[WEEK_CONFIG.finalTask];
      if (!t?.submitted || !t.inputs?.decisive_evidence) return;
      const stance = (t.inputs?.final_position || '').trim();
      const si = WEEK_CONFIG.finalTaskPositions.findIndex(o => o === stance);
      const bucket = si >= 0 ? si : 0;
      stanceDocs[bucket].push(t.inputs.decisive_evidence);
    });
    stanceDocs.forEach((docs, i) => {
      renderCloud(`cloud-final-${i}`, docs, CLOUD_ACCENT_COLORS[i] || '#fff');
    });
  }
}

// ── Detail view ────────────────────────────────────────────────────────────
function renderDetail(data, taskId) {
  const view = document.getElementById('detail-view');
  const entries = Object.values(data)
    .filter(gd => gd.tasks?.[taskId])
    .map(gd => ({ group: gd.summary?.group || '?', task: gd.tasks[taskId] }))
    .sort((a,b) => (b.task.submitted ? 1 : 0) - (a.task.submitted ? 1 : 0));
  if (entries.length === 0) {
    view.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:8px 0;">No responses yet.</p>';
    return;
  }
  view.innerHTML = entries.map(e => {
    const inputs = e.task.inputs || {};
    const content = Object.entries(inputs).map(([k, v]) => {
      if (!v || v.length < 2) return '';
      if (v.length < 80 && !v.includes('.')) return `<div class="detail-choice-tag">${v}</div>`;
      return `<div class="detail-text">${v}</div>`;
    }).join('');
    const statusColor = e.task.submitted ? 'var(--green)' : 'var(--muted)';
    return `<div class="detail-entry">
      <div class="detail-group" style="color:${statusColor}">${e.group} · ${e.task.submitted ? 'Submitted' : 'In progress'}</div>
      ${content || '<div class="detail-text" style="color:var(--muted)">No input yet.</div>'}
    </div>`;
  }).join('');
}

detailSelect.addEventListener('change', function() {
  if (this.value && window._groupData) renderDetail(window._groupData, parseInt(this.value));
  else document.getElementById('detail-view').innerHTML = '';
});

renderAll({});
</script>
